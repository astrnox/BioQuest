name: Update Star Chart
on:
  schedule:
    - cron: '0 */3 * * *'  # 每3小时自动更新
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install PyGithub matplotlib
      - name: 生成 Star 趋势图
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import os
          from github import Github
          import matplotlib.pyplot as plt

          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo("astrnox/bioquest")
          
          # 拉取全部star历史记录
          stars = []
          count = 0
          for star in repo.get_stargazers_with_dates():
              count += 1
              stars.append((star.starred_at, count))
          
          # 绘制折线图
          dates = [s[0] for s in stars]
          nums = [s[1] for s in stars]
          
          plt.figure(figsize=(12, 4), dpi=150)
          plt.plot(dates, nums, color='#2da44e', linewidth=2)
          plt.title('BioQuest Star Growth Trend', fontsize=12)
          plt.xlabel('Date', fontsize=10)
          plt.ylabel('Stars', fontsize=10)
          plt.grid(alpha=0.3, linestyle='--')
          plt.tight_layout()
          plt.savefig('star-trend.png', bbox_inches='tight')
        shell: python
      - name: 提交并推送图片
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-trend.png
          git commit -m "auto: update star trend chart" || exit 0
          git push
