<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c92a2a"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f9e44"/>
    </marker>
  </defs>
  <rect width="800" height="550" fill="#fafbfc" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#212529">Lac Operon: Inducible Gene Regulation</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#6c757d">Adapted from Oehler &amp; Schlief, Front Mol Biosci 2022 (DOI: 10.3389/fmolb.2022.846805)</text>

  <!-- DNA double helix representation -->
  <rect x="60" y="200" width="680" height="12" rx="6" fill="#74c0fc" stroke="#1971c2" stroke-width="1.5"/>
  <rect x="60" y="216" width="680" height="12" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.5"/>
  <text x="40" y="215" text-anchor="end" font-size="11" fill="#1971c2" font-weight="bold">DNA</text>

  <!-- Promoter region -->
  <rect x="180" y="185" width="100" height="55" rx="4" fill="#ffd43b" fill-opacity="0.3" stroke="#f59f00" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="230" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67700">Promoter</text>
  <text x="230" y="255" text-anchor="middle" font-size="10" fill="#e67700">-35 / -10</text>

  <!-- Operator region -->
  <rect x="310" y="185" width="80" height="55" rx="4" fill="#ff8787" fill-opacity="0.3" stroke="#c92a2a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="350" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#c92a2a">Operator</text>
  <text x="350" y="255" text-anchor="middle" font-size="10" fill="#c92a2a">lacO</text>

  <!-- Structural genes -->
  <rect x="420" y="190" width="80" height="40" rx="4" fill="#69db7c" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="460" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">lacZ</text>

  <rect x="510" y="190" width="80" height="40" rx="4" fill="#69db7c" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="550" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">lacY</text>

  <rect x="600" y="190" width="80" height="40" rx="4" fill="#69db7c" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="640" y="215" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">lacA</text>

  <!-- Arrows for transcription direction -->
  <path d="M 420 170 L 680 170" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="550" y="165" text-anchor="middle" font-size="10" fill="#2f9e44">transcription →</text>

  <!-- LacI repressor protein -->
  <ellipse cx="350" cy="130" rx="45" ry="30" fill="#ff8787" stroke="#c92a2a" stroke-width="2"/>
  <text x="350" y="127" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">LacI</text>
  <text x="350" y="142" text-anchor="middle" font-size="9" fill="#fff">repressor</text>

  <!-- LacI binding arrow to operator -->
  <path d="M 350 160 L 350 185" fill="none" stroke="#c92a2a" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="380" y="175" font-size="9" fill="#c92a2a">blocks</text>

  <!-- RNA Polymerase -->
  <ellipse cx="230" cy="130" rx="50" ry="28" fill="#74c0fc" stroke="#1971c2" stroke-width="2"/>
  <text x="230" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">RNA Pol</text>
  <text x="230" y="142" text-anchor="middle" font-size="9" fill="#fff">σ⁷⁰</text>

  <!-- CAP-cAMP activator -->
  <ellipse cx="140" cy="130" rx="40" ry="25" fill="#b197fc" stroke="#7048e8" stroke-width="2"/>
  <text x="140" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">CAP</text>
  <text x="140" y="142" text-anchor="middle" font-size="9" fill="#fff">+cAMP</text>

  <path d="M 160 155 Q 190 170 200 185" fill="none" stroke="#7048e8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="145" y="175" font-size="9" fill="#7048e8">activates</text>

  <!-- Inducer: Allolactose -->
  <rect x="280" y="70" width="140" height="30" rx="15" fill="#ffc078" stroke="#e8590c" stroke-width="2"/>
  <text x="350" y="90" text-anchor="middle" font-size="12" font-weight="bold" fill="#212529">Allolactose</text>

  <!-- Allolactose binds LacI -->
  <path d="M 350 100 L 350 100" fill="none" stroke="#e8590c" stroke-width="2"/>
  <text x="395" y="110" font-size="9" fill="#e8590c">binds LacI →</text>
  <text x="395" y="122" font-size="9" fill="#e8590c">releases operator</text>

  <!-- Glucose/cAMP relationship -->
  <rect x="60" y="380" width="320" height="140" rx="8" fill="#fff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="220" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Glucose Effect (Catabolite Repression)</text>

  <!-- High glucose -->
  <text x="100" y="435" font-size="11" fill="#495057">High glucose:</text>
  <text x="100" y="452" font-size="10" fill="#6c757d">→ low cAMP → CAP inactive</text>
  <text x="100" y="468" font-size="10" fill="#6c757d">→ operon OFF (even if lactose present)</text>
  <circle cx="310" cy="448" r="12" fill="#ff8787" stroke="#c92a2a" stroke-width="1.5"/>
  <text x="310" y="453" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">×</text>

  <!-- Low glucose -->
  <text x="100" y="495" font-size="11" fill="#495057">Low glucose:</text>
  <text x="100" y="512" font-size="10" fill="#6c757d">→ high cAMP → CAP active</text>
  <circle cx="310" cy="505" r="12" fill="#69db7c" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="310" y="510" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">✓</text>

  <!-- Summary states -->
  <rect x="420" y="380" width="350" height="140" rx="8" fill="#fff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="595" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#212529">Operon States</text>

  <text x="440" y="435" font-size="11" fill="#495057">Glucose⁺ Lactose⁻ :</text>
  <rect x="600" y="422" width="60" height="18" rx="4" fill="#ff8787"/>
  <text x="630" y="436" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">OFF</text>

  <text x="440" y="462" font-size="11" fill="#495057">Glucose⁺ Lactose⁺ :</text>
  <rect x="600" y="449" width="60" height="18" rx="4" fill="#ffd43b"/>
  <text x="630" y="463" text-anchor="middle" font-size="10" font-weight="bold" fill="#212529">LOW</text>

  <text x="440" y="489" font-size="11" fill="#495057">Glucose⁻ Lactose⁺ :</text>
  <rect x="600" y="476" width="60" height="18" rx="4" fill="#69db7c"/>
  <text x="630" y="490" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">HIGH</text>

  <text x="440" y="516" font-size="11" fill="#495057">Glucose⁻ Lactose⁻ :</text>
  <rect x="600" y="503" width="60" height="18" rx="4" fill="#ff8787"/>
  <text x="630" y="517" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">OFF</text>
</svg>
