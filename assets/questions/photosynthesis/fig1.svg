<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <linearGradient id="thy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#b2f2bb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#69db7c;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="stroma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#stroma)" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#212529">Z-Scheme &amp; Calvin Cycle Integration</text>
  <text x="400" y="50" text-anchor="middle" font-size="11" fill="#6c757d">Adapted from Stirbet et al., Photosynth Res 2023 (DOI: 10.1007/s11120-023-01001-2)</text>

  <!-- Thylakoid membrane -->
  <rect x="40" y="140" width="720" height="120" rx="10" fill="url(#thy)" stroke="#2f9e44" stroke-width="2"/>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#2f9e44" font-weight="bold">Thylakoid Membrane</text>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#6c757d">Stroma (above) / Lumen (below membrane)</text>

  <!-- PSII complex -->
  <rect x="80" y="160" width="100" height="80" rx="8" fill="#37b24d" stroke="#2f9e44" stroke-width="2"/>
  <text x="130" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">PSII</text>
  <text x="130" y="215" text-anchor="middle" font-size="10" fill="#fff">P680</text>
  <text x="130" y="230" text-anchor="middle" font-size="9" fill="#d8f5a2">OEC</text>

  <!-- PQ pool -->
  <rect x="210" y="185" width="60" height="30" rx="15" fill="#fab005" stroke="#e67700" stroke-width="1.5"/>
  <text x="240" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PQ</text>

  <!-- Cyt b6f -->
  <rect x="300" y="160" width="100" height="80" rx="8" fill="#f76707" stroke="#e8590c" stroke-width="2"/>
  <text x="350" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Cyt b6f</text>
  <text x="350" y="215" text-anchor="middle" font-size="10" fill="#fff">Q-cycle</text>

  <!-- PC -->
  <rect x="430" y="185" width="50" height="30" rx="15" fill="#1c7ed6" stroke="#1971c2" stroke-width="1.5"/>
  <text x="455" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">PC</text>

  <!-- PSI complex -->
  <rect x="510" y="160" width="100" height="80" rx="8" fill="#5c7cfa" stroke="#364fc7" stroke-width="2"/>
  <text x="560" y="195" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">PSI</text>
  <text x="560" y="215" text-anchor="middle" font-size="10" fill="#fff">P700</text>

  <!-- Fd -->
  <rect x="640" y="185" width="50" height="30" rx="15" fill="#845ef7" stroke="#5f3dc4" stroke-width="1.5"/>
  <text x="665" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Fd</text>

  <!-- FNR / NADPH -->
  <rect x="710" y="170" width="60" height="50" rx="6" fill="#e64980" stroke="#a61e4d" stroke-width="1.5"/>
  <text x="740" y="192" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">FNR</text>
  <text x="740" y="208" text-anchor="middle" font-size="9" fill="#fff">NADP⁺→</text>
  <text x="740" y="218" text-anchor="middle" font-size="9" fill="#ffc9de">NADPH</text>

  <!-- Electron flow arrows (Z-scheme) -->
  <path d="M 180 200 L 210 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 270 200 L 300 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 400 200 L 430 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 480 200 L 510 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 610 200 L 640 200" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M 690 200 L 710 195" fill="none" stroke="#333" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Light energy inputs -->
  <text x="130" y="150" text-anchor="middle" font-size="12" fill="#f59f00" font-weight="bold">hν (680nm)</text>
  <path d="M 130 155 L 130 160" fill="none" stroke="#f59f00" stroke-width="2" marker-end="url(#ar)"/>

  <text x="560" y="150" text-anchor="middle" font-size="12" fill="#f59f00" font-weight="bold">hν (700nm)</text>
  <path d="M 560 155 L 560 160" fill="none" stroke="#f59f00" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Water splitting -->
  <text x="80" y="260" font-size="11" fill="#1971c2" font-weight="bold">2H₂O → O₂ + 4H⁺ + 4e⁻</text>
  <path d="M 130 240 L 130 250" fill="none" stroke="#1971c2" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- H+ gradient (lumen) -->
  <rect x="40" y="260" width="720" height="30" rx="4" fill="#fff3bf" stroke="#f59f00" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="400" y="280" text-anchor="middle" font-size="11" fill="#e67700" font-weight="bold">Lumen: [H⁺] high (pH ~5)</text>

  <!-- ATP synthase -->
  <rect x="430" y="290" width="80" height="70" rx="8" fill="#ff922b" stroke="#e8590c" stroke-width="2"/>
  <text x="470" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ATP</text>
  <text x="470" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Synthase</text>
  <text x="470" y="355" text-anchor="middle" font-size="9" fill="#fff">CF₀-CF₁</text>

  <!-- H+ flow through ATP synthase -->
  <path d="M 470 290 L 470 270" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="500" y="285" font-size="9" fill="#e8590c">H⁺ flow</text>

  <!-- ATP output -->
  <path d="M 470 360 L 470 390" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="470" y="405" text-anchor="middle" font-size="12" fill="#e8590c" font-weight="bold">ADP + Pi → ATP</text>

  <!-- Calvin Cycle (below) -->
  <circle cx="400" cy="490" r="85" fill="none" stroke="#2f9e44" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="400" y="410" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f9e44">Calvin Cycle (Stroma)</text>

  <!-- Calvin cycle stages -->
  <text x="400" y="440" text-anchor="middle" font-size="11" fill="#495057">CO₂ + RuBP (C5)</text>
  <text x="310" y="475" text-anchor="middle" font-size="11" fill="#495057">↓ Rubisco</text>
  <text x="400" y="500" text-anchor="middle" font-size="11" fill="#495057">2 × 3-PGA (C3)</text>
  <text x="490" y="475" text-anchor="middle" font-size="11" fill="#495057">↓ ATP+NADPH</text>
  <text x="400" y="530" text-anchor="middle" font-size="11" fill="#495057">G3P → Glucose / RuBP regen</text>

  <!-- Inputs to Calvin cycle -->
  <path d="M 470 405 Q 440 430 420 445" fill="none" stroke="#e8590c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="530" y="430" font-size="10" fill="#e8590c">ATP</text>

  <path d="M 740 220 Q 700 350 500 460" fill="none" stroke="#a61e4d" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#ar)"/>
  <text x="680" y="350" font-size="10" fill="#a61e4d">NADPH</text>

  <!-- CO2 input -->
  <text x="250" y="445" font-size="12" fill="#495057" font-weight="bold">CO₂</text>
  <path d="M 270 448 L 315 465" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- O2 output -->
  <text x="50" y="300" font-size="12" fill="#1971c2" font-weight="bold">O₂ ↑</text>

  <!-- Summary box -->
  <rect x="50" y="380" width="200" height="80" rx="6" fill="#fff" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="150" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#212529">Overall:</text>
  <text x="150" y="418" text-anchor="middle" font-size="10" fill="#495057">6CO₂ + 12H₂O + light</text>
  <text x="150" y="436" text-anchor="middle" font-size="10" fill="#2f9e44">→ C₆H₁₂O₆ + 6O₂ + 6H₂O</text>
  <text x="150" y="452" text-anchor="middle" font-size="9" fill="#6c757d">Light rxn: H₂O → O₂ + ATP + NADPH</text>
</svg>
