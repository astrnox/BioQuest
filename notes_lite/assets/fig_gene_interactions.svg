<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640" style="font-family: sans-serif;">
  <rect x="0" y="0" width="880" height="640" fill="#fdfbf7"/>
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2416">基因互作类型总结(9:3:3:1的变式)</text>
  <text x="440" y="46" text-anchor="middle" font-size="11" fill="#8b4513">两对独立遗传基因(AaBb×AaBb)F2基本比 9 A_B_ : 3 A_bb : 3 aaB_ : 1 aabb,基因互作改变表型分组</text>

  <!-- 基础9:3:3:1图例 -->
  <rect x="20" y="60" width="200" height="56" rx="4" fill="#fff8e7" stroke="#8b4513"/>
  <text x="120" y="78" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">基础比 9:3:3:1</text>
  <rect x="30" y="86" width="42" height="20" fill="#c0392b" opacity="0.8"/>
  <text x="51" y="100" text-anchor="middle" font-size="9" fill="#fff">9 A_B_</text>
  <rect x="74" y="86" width="28" height="20" fill="#4a7c3a" opacity="0.8"/>
  <text x="88" y="100" text-anchor="middle" font-size="9" fill="#fff">3 A_bb</text>
  <rect x="104" y="86" width="28" height="20" fill="#8b4513" opacity="0.8"/>
  <text x="118" y="100" text-anchor="middle" font-size="9" fill="#fff">3 aaB_</text>
  <rect x="134" y="86" width="20" height="20" fill="#d6ccc0" stroke="#2c2416"/>
  <text x="144" y="100" text-anchor="middle" font-size="9" fill="#2c2416">1 aabb</text>
  <text x="160" y="100" font-size="9" fill="#7a6e5e">无互作</text>

  <!-- ====== 6种互作类型, 2行3列 ====== -->

  <!-- 1. 互补作用 9:7 -->
  <rect x="20" y="130" width="270" height="180" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="155" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">①互补作用 9:7</text>
  <rect x="40" y="162" width="42" height="22" fill="#c0392b" opacity="0.8"/>
  <text x="61" y="177" text-anchor="middle" font-size="9" fill="#fff">9 A_B_</text>
  <rect x="84" y="162" width="28" height="22" fill="#4a7c3a" opacity="0.8"/>
  <text x="84" y="178" text-anchor="middle" font-size="10" fill="#fff"></text>
  <rect x="84" y="162" width="28" height="22" fill="#4a7c3a" opacity="0.6"/>
  <rect x="114" y="162" width="28" height="22" fill="#8b4513" opacity="0.6"/>
  <rect x="144" y="162" width="20" height="22" fill="#d6ccc0" stroke="#2c2416"/>
  <text x="172" y="178" font-size="9" fill="#4a7c3a">合并=7</text>
  <text x="40" y="200" font-size="10" fill="#2c2416">两对显性基因同时存在(A_B_)</text>
  <text x="40" y="216" font-size="10" fill="#2c2416">才表现性状,缺一即另一表型</text>
  <text x="40" y="240" font-size="9" fill="#8b4513" font-weight="700">例:香豌豆花色</text>
  <text x="40" y="255" font-size="9" fill="#7a6e5e">C_P_紫花,其余白花</text>
  <text x="40" y="278" font-size="9" fill="#c0392b">两酶连续催化,缺任一阻断</text>
  <text x="40" y="295" font-size="9" fill="#7a6e5e">F1测交:1:3</text>

  <!-- 2. 重叠作用 15:1 -->
  <rect x="300" y="130" width="270" height="180" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="435" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">②重叠作用 15:1</text>
  <rect x="320" y="162" width="42" height="22" fill="#c0392b" opacity="0.8"/>
  <text x="341" y="177" text-anchor="middle" font-size="9" fill="#fff">9</text>
  <rect x="364" y="162" width="28" height="22" fill="#c0392b" opacity="0.7"/>
  <text x="378" y="177" text-anchor="middle" font-size="9" fill="#fff">3</text>
  <rect x="394" y="162" width="28" height="22" fill="#c0392b" opacity="0.6"/>
  <text x="408" y="177" text-anchor="middle" font-size="9" fill="#fff">3</text>
  <rect x="424" y="162" width="20" height="22" fill="#d6ccc0" stroke="#2c2416"/>
  <text x="434" y="177" text-anchor="middle" font-size="9" fill="#2c2416">1</text>
  <text x="452" y="178" font-size="9" fill="#c0392b">合并=15</text>
  <text x="320" y="200" font-size="10" fill="#2c2416">任一显性基因即表现性状</text>
  <text x="320" y="216" font-size="10" fill="#2c2416">(A_或B_),仅双隐性(aabb)为另一表型</text>
  <text x="320" y="240" font-size="9" fill="#8b4513" font-weight="700">例:荠菜果形</text>
  <text x="320" y="255" font-size="9" fill="#7a6e5e">A_或B_三角果,aabb卵形果</text>
  <text x="320" y="278" font-size="9" fill="#c0392b">两基因功能冗余(重复基因)</text>
  <text x="320" y="295" font-size="9" fill="#7a6e5e">F1测交:3:1</text>

  <!-- 3. 隐性上位 9:3:4 -->
  <rect x="580" y="130" width="270" height="180" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="715" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">③隐性上位 9:3:4</text>
  <rect x="600" y="162" width="42" height="22" fill="#c0392b" opacity="0.8"/>
  <text x="621" y="177" text-anchor="middle" font-size="9" fill="#fff">9 A_B_</text>
  <rect x="644" y="162" width="28" height="22" fill="#4a7c3a" opacity="0.8"/>
  <text x="658" y="177" text-anchor="middle" font-size="9" fill="#fff">3 A_bb</text>
  <rect x="674" y="162" width="28" height="22" fill="#8b4513" opacity="0.7"/>
  <rect x="704" y="162" width="20" height="22" fill="#8b4513" opacity="0.7"/>
  <text x="732" y="178" font-size="9" fill="#8b4513">合并=4</text>
  <text x="600" y="200" font-size="10" fill="#2c2416">aa隐性纯合掩盖B/b表达</text>
  <text x="600" y="216" font-size="10" fill="#2c2416">(aaB_与aabb同为aa表型)</text>
  <text x="600" y="240" font-size="9" fill="#8b4513" font-weight="700">例:家兔毛色</text>
  <text x="600" y="255" font-size="9" fill="#7a6e5e">C_有色,B_黑,bb褐,cc白</text>
  <text x="600" y="278" font-size="9" fill="#c0392b">上位基因产物在前(通路阻断)</text>
  <text x="600" y="295" font-size="9" fill="#7a6e5e">F1测交:1:1:2</text>

  <!-- 4. 显性上位 12:3:1 -->
  <rect x="20" y="325" width="270" height="180" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="155" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">④显性上位 12:3:1</text>
  <rect x="40" y="357" width="42" height="22" fill="#c0392b" opacity="0.8"/>
  <text x="61" y="372" text-anchor="middle" font-size="9" fill="#fff">9 A_B_</text>
  <rect x="84" y="357" width="28" height="22" fill="#c0392b" opacity="0.7"/>
  <text x="98" y="372" text-anchor="middle" font-size="9" fill="#fff">3 A_bb</text>
  <text x="118" y="372" font-size="9" fill="#c0392b">合并=12</text>
  <rect x="114" y="357" width="28" height="22" fill="#4a7c3a" opacity="0.8"/>
  <text x="128" y="372" text-anchor="middle" font-size="9" fill="#fff">3 aaB_</text>
  <rect x="144" y="357" width="20" height="22" fill="#d6ccc0" stroke="#2c2416"/>
  <text x="154" y="372" text-anchor="middle" font-size="9" fill="#2c2416">1</text>
  <text x="40" y="395" font-size="10" fill="#2c2416">显性A_掩盖B/b的表达</text>
  <text x="40" y="411" font-size="10" fill="#2c2416">(A_B_与A_bb同为A_表型)</text>
  <text x="40" y="435" font-size="9" fill="#8b4513" font-weight="700">例:南瓜皮色</text>
  <text x="40" y="450" font-size="9" fill="#7a6e5e">W_白,wwY_黄,wwyy绿</text>
  <text x="40" y="473" font-size="9" fill="#c0392b">上位基因产物抑制后续基因</text>
  <text x="40" y="490" font-size="9" fill="#7a6e5e">F1测交:2:1:1</text>

  <!-- 5. 积加作用 9:6:1 -->
  <rect x="300" y="325" width="270" height="180" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="435" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">⑤积加作用 9:6:1</text>
  <rect x="320" y="357" width="42" height="22" fill="#c0392b" opacity="0.8"/>
  <text x="341" y="372" text-anchor="middle" font-size="9" fill="#fff">9 A_B_</text>
  <rect x="364" y="357" width="28" height="22" fill="#4a7c3a" opacity="0.7"/>
  <rect x="394" y="357" width="28" height="22" fill="#8b4513" opacity="0.7"/>
  <text x="422" y="372" font-size="9" fill="#8b4513">合并=6</text>
  <rect x="424" y="357" width="20" height="22" fill="#d6ccc0" stroke="#2c2416"/>
  <text x="434" y="372" text-anchor="middle" font-size="9" fill="#2c2416">1</text>
  <text x="320" y="395" font-size="10" fill="#2c2416">两种显性并存=表型1</text>
  <text x="320" y="411" font-size="10" fill="#2c2416">任一显性=表型2(累加效应)</text>
  <text x="320" y="427" font-size="10" fill="#2c2416">双隐性=表型3</text>
  <text x="320" y="451" font-size="9" fill="#8b4513" font-weight="700">例:小麦粒色</text>
  <text x="320" y="466" font-size="9" fill="#7a6e5e">两对基因剂量累加</text>
  <text x="320" y="489" font-size="9" fill="#c0392b">又称双隐性上位/积加</text>

  <!-- 6. 抑制作用 13:3 -->
  <rect x="580" y="325" width="270" height="180" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="715" y="347" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">⑥抑制作用 13:3</text>
  <rect x="600" y="357" width="42" height="22" fill="#c0392b" opacity="0.8"/>
  <text x="621" y="372" text-anchor="middle" font-size="9" fill="#fff">9 A_B_</text>
  <rect x="644" y="357" width="28" height="22" fill="#c0392b" opacity="0.7"/>
  <text x="658" y="372" text-anchor="middle" font-size="9" fill="#fff">3 A_bb</text>
  <rect x="674" y="357" width="20" height="22" fill="#d6ccc0" stroke="#2c2416"/>
  <text x="684" y="372" text-anchor="middle" font-size="9" fill="#2c2416">1</text>
  <text x="702" y="372" font-size="9" fill="#c0392b">合并=13</text>
  <rect x="704" y="357" width="28" height="22" fill="#4a7c3a" opacity="0.8"/>
  <text x="718" y="372" text-anchor="middle" font-size="9" fill="#fff">3 aaB_</text>
  <text x="600" y="395" font-size="10" fill="#2c2416">显性抑制基因I_抑制性状表达</text>
  <text x="600" y="411" font-size="10" fill="#2c2416">(I_无色),仅iiC_表现有色</text>
  <text x="600" y="435" font-size="9" fill="#8b4513" font-weight="700">例:白三叶草叶斑/玉米胚乳</text>
  <text x="600" y="450" font-size="9" fill="#7a6e5e">I_抑制,C_有色,ic无色</text>
  <text x="600" y="473" font-size="9" fill="#c0392b">抑制基因本身不决定表型</text>
  <text x="600" y="490" font-size="9" fill="#7a6e5e">F1测交:1:3</text>

  <!-- 底部总结 -->
  <rect x="20" y="520" width="840" height="105" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.2"/>
  <text x="40" y="544" font-size="12" font-weight="700" fill="#c0392b">记忆要点</text>
  <text x="40" y="566" font-size="10" fill="#2c2416">·9:3:3:1变式的本质:两对独立基因的16种基因型按表型重新分组;比值之和恒为16</text>
  <text x="40" y="586" font-size="10" fill="#2c2416">·上位(epistasis):一对基因掩盖另一对基因的表达;隐性上位=aa掩盖B,显性上位=A_掩盖B</text>
  <text x="40" y="606" font-size="10" fill="#2c2416">·互补(9:7)=两显性缺一不可;重叠(15:1)=任一显性即可;积加(9:6:1)=数量累加;抑制(13:3)=显性抑制基因阻遏</text>
</svg>
