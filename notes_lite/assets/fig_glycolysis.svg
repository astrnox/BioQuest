<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" style="font-family: sans-serif;">
  <rect x="0" y="0" width="860" height="760" fill="#fdfbf7"/>
  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2416">糖酵解(EMP)途径 10步反应</text>
  <text x="430" y="46" text-anchor="middle" font-size="11" fill="#8b4513">净产物: 1葡萄糖 → 2丙酮酸 + 2ATP + 2NADH (胞质中进行)</text>

  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2c2416"/></marker>
    <marker id="arR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/></marker>
  </defs>

  <!-- ====== 耗能阶段(投入2ATP) ====== -->
  <rect x="20" y="60" width="820" height="320" rx="6" fill="#fff8e7" opacity="0.5"/>
  <text x="40" y="80" font-size="12" fill="#8b4513" font-weight="700">耗能阶段(准备阶段):投入2个ATP</text>

  <!-- 葡萄糖 -->
  <rect x="350" y="92" width="160" height="32" rx="4" fill="#c0392b" opacity="0.8"/>
  <text x="430" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">葡萄糖 Glucose</text>
  <!-- 1. 己糖激酶 -->
  <line x1="430" y1="128" x2="430" y2="158" stroke="#c0392b" stroke-width="2" marker-end="url(#arR)"/>
  <text x="442" y="146" font-size="10" fill="#c0392b" font-weight="700">①己糖激酶</text>
  <text x="442" y="158" font-size="9" fill="#7a6e5e">ATP→ADP (不可逆)</text>

  <!-- G6P -->
  <rect x="350" y="164" width="160" height="30" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="430" y="184" text-anchor="middle" font-size="12" font-weight="600" fill="#2c2416">6-磷酸葡萄糖 G6P</text>
  <!-- 2. PGI -->
  <line x1="430" y1="198" x2="430" y2="226" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="442" y="216" font-size="10" fill="#2c2416">②磷酸葡萄糖异构酶</text>

  <!-- F6P -->
  <rect x="350" y="232" width="160" height="30" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="430" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#2c2416">6-磷酸果糖 F6P</text>
  <!-- 3. PFK-1 限速 -->
  <line x1="430" y1="266" x2="430" y2="296" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arR)"/>
  <text x="442" y="282" font-size="10" fill="#c0392b" font-weight="700">③磷酸果糖激酶-1</text>
  <text x="442" y="295" font-size="9" fill="#c0392b" font-weight="700">★限速酶 ATP→ADP(不可逆)</text>

  <!-- F1,6BP -->
  <rect x="340" y="302" width="180" height="30" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="430" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#2c2416">1,6-二磷酸果糖 F1,6BP</text>
  <!-- 4. 醛缩酶 -->
  <line x1="430" y1="336" x2="430" y2="356" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="442" y="350" font-size="10" fill="#2c2416">④醛缩酶(裂解)</text>

  <!-- 分支 DHAP / GAP -->
  <line x1="430" y1="358" x2="290" y2="385" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="430" y1="358" x2="570" y2="385" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="220" y="388" width="140" height="28" rx="4" fill="#d6ccc0" stroke="#8b4513"/>
  <text x="290" y="406" text-anchor="middle" font-size="11" fill="#2c2416">磷酸二羟丙酮 DHAP</text>
  <rect x="500" y="388" width="140" height="28" rx="4" fill="#d6ccc0" stroke="#8b4513"/>
  <text x="570" y="406" text-anchor="middle" font-size="11" fill="#2c2416">3-磷酸甘油醛 GAP</text>
  <!-- 5. TPI -->
  <path d="M 290,418 Q 380,450 540,418" fill="none" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="415" y="442" text-anchor="middle" font-size="10" fill="#2c2416">⑤磷酸丙糖异构酶</text>

  <!-- ====== 产能阶段(x2) ====== -->
  <rect x="20" y="460" width="820" height="280" rx="6" fill="#f0f7f4" opacity="0.5"/>
  <text x="40" y="480" font-size="12" fill="#4a7c3a" font-weight="700">产能阶段(氧化阶段):以下反应×2 (1分子GAP→1丙酮酸)</text>

  <!-- 6. GAPDH -->
  <rect x="500" y="468" width="140" height="28" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="570" y="486" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2416">3-磷酸甘油醛 GAP</text>
  <line x1="570" y1="498" x2="570" y2="520" stroke="#4a7c3a" stroke-width="2" marker-end="url(#ar)"/>
  <text x="582" y="514" font-size="10" fill="#4a7c3a" font-weight="700">⑥GAP脱氢酶</text>
  <text x="582" y="526" font-size="9" fill="#7a6e5e">NAD&#8314;→NADH+H&#8314;,加Pi</text>

  <!-- 1,3-BPG -->
  <rect x="490" y="526" width="160" height="28" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="570" y="544" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2416">1,3-二磷酸甘油酸</text>
  <line x1="570" y1="556" x2="570" y2="578" stroke="#c0392b" stroke-width="2" marker-end="url(#arR)"/>
  <text x="582" y="572" font-size="10" fill="#c0392b" font-weight="700">⑦磷酸甘油酸激酶</text>
  <text x="582" y="584" font-size="9" fill="#c0392b">底物水平磷酸化 ADP→ATP</text>

  <!-- 3-PG -->
  <rect x="500" y="584" width="140" height="28" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="570" y="602" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2416">3-磷酸甘油酸</text>
  <line x1="570" y1="614" x2="570" y2="636" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="582" y="630" font-size="10" fill="#2c2416">⑧磷酸甘油酸变位酶</text>

  <!-- 2-PG -->
  <rect x="500" y="642" width="140" height="28" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="570" y="660" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2416">2-磷酸甘油酸</text>
  <line x1="570" y1="672" x2="570" y2="694" stroke="#2c2416" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="582" y="688" font-size="10" fill="#2c2416">⑨烯醇化酶(脱水)</text>

  <!-- PEP -->
  <rect x="500" y="700" width="140" height="28" rx="4" fill="#fff3cd" stroke="#8b4513"/>
  <text x="570" y="718" text-anchor="middle" font-size="11" font-weight="600" fill="#2c2416">磷酸烯醇式丙酮酸PEP</text>

  <!-- 左侧总结框 -->
  <rect x="40" y="520" width="380" height="220" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="55" y="544" font-size="13" font-weight="700" fill="#c0392b">能量收支总结</text>
  <text x="55" y="568" font-size="11" fill="#2c2416">耗能阶段: 投入 2 ATP (步骤①③)</text>
  <text x="55" y="588" font-size="11" fill="#2c2416">产能阶段: 产出 4 ATP (步骤⑦⑩,各×2)</text>
  <text x="55" y="608" font-size="11" fill="#2c2416">还原当量: 2 NADH (步骤⑥×2)</text>
  <text x="55" y="636" font-size="12" font-weight="700" fill="#c0392b">净反应:</text>
  <text x="55" y="658" font-size="11" fill="#2c2416">葡萄糖+2ADP+2Pi+2NAD&#8314;</text>
  <text x="55" y="678" font-size="11" fill="#2c2416">→ 2丙酮酸+2ATP+2NADH+2H&#8314;+2H&#8322;O</text>
  <text x="55" y="706" font-size="10" fill="#4a7c3a">三个不可逆步骤(关键调控):①③⑩</text>
  <text x="55" y="724" font-size="10" fill="#4a7c3a">★PFK-1(③)是糖酵解最主要的限速酶</text>
</svg>
