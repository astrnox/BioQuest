<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" style="font-family: sans-serif;">
  <rect x="0" y="0" width="880" height="540" fill="#fdfbf7"/>
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2416">线粒体内膜电子传递链(ETC)与氧化磷酸化</text>

  <!-- 区域标识 -->
  <rect x="0" y="70" width="880" height="120" fill="#f0f7f4" opacity="0.5"/>
  <text x="30" y="90" font-size="13" fill="#4a7c3a" font-weight="700">膜间隙(IMS)  H&#8314;浓度高</text>
  <rect x="0" y="350" width="880" height="150" fill="#fff3cd" opacity="0.35"/>
  <text x="30" y="525" font-size="13" fill="#8b4513" font-weight="700">基质(Matrix)  H&#8314;浓度低</text>

  <!-- 内膜带 -->
  <rect x="0" y="190" width="880" height="160" fill="#d6ccc0" opacity="0.35"/>
  <line x1="0" y1="190" x2="880" y2="190" stroke="#8b4513" stroke-width="2"/>
  <line x1="0" y1="350" x2="880" y2="350" stroke="#8b4513" stroke-width="2"/>
  <text x="845" y="275" font-size="11" fill="#8b4513" font-style="italic">内膜</text>

  <!-- 复合体 I -->
  <rect x="60" y="195" width="110" height="150" rx="6" fill="#c0392b" opacity="0.85"/>
  <text x="115" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">复合体Ⅰ</text>
  <text x="115" y="244" text-anchor="middle" font-size="10" fill="#fff">NADH</text>
  <text x="115" y="258" text-anchor="middle" font-size="10" fill="#fff">脱氢酶</text>
  <text x="115" y="278" text-anchor="middle" font-size="9" fill="#fff">FMN·Fe-S</text>
  <text x="115" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">泵 4H&#8314;</text>
  <!-- NADH/NAD+ -->
  <text x="115" y="378" text-anchor="middle" font-size="11" fill="#2c2416">NADH+H&#8314;</text>
  <line x1="115" y1="362" x2="115" y2="350" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrUp)"/>
  <text x="115" y="398" text-anchor="middle" font-size="10" fill="#7a6e5e">→ NAD&#8314;</text>
  <!-- 质子泵出箭头 -->
  <line x1="100" y1="195" x2="100" y2="110" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrUpR)"/>
  <text x="78" y="150" font-size="10" fill="#c0392b" font-weight="700">4H&#8314;</text>
  <!-- 抑制剂 -->
  <text x="115" y="418" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">抑制剂:鱼藤酮</text>

  <!-- 复合体 II -->
  <rect x="195" y="235" width="90" height="110" rx="6" fill="#8b4513" opacity="0.85"/>
  <text x="240" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">复合体Ⅱ</text>
  <text x="240" y="280" text-anchor="middle" font-size="9" fill="#fff">琥珀酸</text>
  <text x="240" y="293" text-anchor="middle" font-size="9" fill="#fff">脱氢酶</text>
  <text x="240" y="311" text-anchor="middle" font-size="9" fill="#fff">FAD·Fe-S</text>
  <text x="240" y="334" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">不泵H&#8314;</text>
  <text x="240" y="378" text-anchor="middle" font-size="10" fill="#2c2416">FADH&#8322;</text>
  <line x1="240" y1="362" x2="240" y2="345" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrUp)"/>
  <text x="240" y="398" text-anchor="middle" font-size="9" fill="#7a6e5e">琥珀酸→延胡索酸</text>

  <!-- CoQ 移动载体 -->
  <ellipse cx="340" cy="285" rx="26" ry="16" fill="#e8c84a" stroke="#8b4513" stroke-width="1.5"/>
  <text x="340" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#2c2416">CoQ</text>
  <text x="340" y="262" text-anchor="middle" font-size="9" fill="#7a6e5e">(泛醌,移动)</text>
  <!-- 电子流向 Q -->
  <line x1="170" y1="290" x2="314" y2="287" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="285" y1="290" x2="314" y2="288" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- 复合体 III -->
  <rect x="400" y="195" width="110" height="150" rx="6" fill="#4a7c3a" opacity="0.85"/>
  <text x="455" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">复合体Ⅲ</text>
  <text x="455" y="244" text-anchor="middle" font-size="10" fill="#fff">cyt bc&#8321;</text>
  <text x="455" y="262" text-anchor="middle" font-size="9" fill="#fff">b&#8325;&#8326;&#8322;/b&#8325;&#8326;&#8326;</text>
  <text x="455" y="278" text-anchor="middle" font-size="9" fill="#fff">Fe-S</text>
  <text x="455" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">泵 4H&#8314;</text>
  <line x1="366" y1="285" x2="400" y2="285" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="440" y1="195" x2="440" y2="110" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrUpR)"/>
  <text x="418" y="150" font-size="10" fill="#c0392b" font-weight="700">4H&#8314;</text>
  <text x="455" y="418" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">抑制剂:抗霉素A</text>

  <!-- cyt c 移动载体 -->
  <circle cx="585" cy="210" r="18" fill="#5dade2" stroke="#2c2416" stroke-width="1.5"/>
  <text x="585" y="214" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">cyt c</text>
  <text x="585" y="184" text-anchor="middle" font-size="9" fill="#7a6e5e">(移动,水溶性)</text>
  <line x1="510" y1="230" x2="572" y2="214" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrR)"/>

  <!-- 复合体 IV -->
  <rect x="630" y="195" width="110" height="150" rx="6" fill="#2c2416" opacity="0.85"/>
  <text x="685" y="225" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">复合体Ⅳ</text>
  <text x="685" y="244" text-anchor="middle" font-size="10" fill="#fff">cyt c</text>
  <text x="685" y="258" text-anchor="middle" font-size="10" fill="#fff">氧化酶</text>
  <text x="685" y="278" text-anchor="middle" font-size="9" fill="#fff">a·a&#8323;·Cu</text>
  <text x="685" y="332" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">泵 2H&#8314;</text>
  <line x1="603" y1="210" x2="630" y2="220" stroke="#2c2416" stroke-width="1.5" marker-end="url(#arrR)"/>
  <line x1="670" y1="195" x2="670" y2="110" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrUpR)"/>
  <text x="648" y="150" font-size="10" fill="#c0392b" font-weight="700">2H&#8314;</text>
  <text x="685" y="378" text-anchor="middle" font-size="10" fill="#2c2416">&#189;O&#8322;+2H&#8314;→H&#8322;O</text>
  <text x="685" y="418" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">抑制剂:CN&#8315;/CO/N&#8323;&#8315;</text>

  <!-- 复合体 V ATP合酶 -->
  <rect x="775" y="195" width="70" height="150" rx="6" fill="#8b4513" opacity="0.85"/>
  <text x="810" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">复合体Ⅴ</text>
  <text x="810" y="244" text-anchor="middle" font-size="10" fill="#fff">F&#8320;F&#8321;</text>
  <text x="810" y="258" text-anchor="middle" font-size="9" fill="#fff">ATP合酶</text>
  <text x="810" y="278" text-anchor="middle" font-size="9" fill="#fff">转子旋转</text>
  <!-- 质子回流箭头(向下) -->
  <line x1="810" y1="110" x2="810" y2="193" stroke="#4a7c3a" stroke-width="2.5" marker-end="url(#arrDownG)"/>
  <text x="822" y="150" font-size="10" fill="#4a7c3a" font-weight="700">H&#8314;回流</text>
  <text x="810" y="378" text-anchor="middle" font-size="10" fill="#2c2416">ADP+Pi→ATP</text>
  <text x="810" y="418" text-anchor="middle" font-size="9" fill="#c0392b" font-style="italic">抑制剂:寡霉素</text>

  <!-- 电子流向标注 -->
  <text x="440" y="505" text-anchor="middle" font-size="12" fill="#2c2416" font-weight="700">电子流向: NADH/FADH&#8322; → 复合体Ⅰ/Ⅱ → CoQ → 复合体Ⅲ → cyt c → 复合体Ⅳ → O&#8322;</text>
  <text x="440" y="525" text-anchor="middle" font-size="11" fill="#8b4513">每对电子: 复合体Ⅰ+Ⅲ+Ⅳ共泵出 4+4+2=10个H&#8314; (FADH&#8322;绕过Ⅰ,泵6个); P/O比: NADH≈2.5, FADH&#8322;≈1.5</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,6 L4,0 L8,6 Z" fill="#2c2416"/></marker>
    <marker id="arrUpR" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,6 L4,0 L8,6 Z" fill="#c0392b"/></marker>
    <marker id="arrDownG" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0,2 L4,8 L8,2 Z" fill="#4a7c3a"/></marker>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2c2416"/></marker>
  </defs>
</svg>
