<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="480" fill="#fdfbf7"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">姜目（Zingiberales）8科系统发生与花图式演化</text>

  <!-- 系统发生树 -->
  <text x="30" y="55" font-size="11" font-weight="700" fill="#8b4513">A. 姜目系统发生关系（芭蕉科最基部，姜科+闭鞘姜科姊妹群）</text>

  <!-- 树结构 -->
  <!-- 芭蕉科 Musaceae -->
  <line x1="390" y1="70" x2="390" y2="90" stroke="#2c2416" stroke-width="2"/>
  <line x1="390" y1="90" x2="60" y2="120" stroke="#2c2416" stroke-width="2"/>
  <g transform="translate(10, 125)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#fef0e0" stroke="#c0392b" stroke-width="1.5"/>
    <text x="50" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">芭蕉科</text>
  </g>
  <text x="60" y="170" text-anchor="middle" font-size="8" fill="#7a6e5e">5-6枚可育雄蕊</text>
  <text x="60" y="182" text-anchor="middle" font-size="8" fill="#7a6e5e">（最原始）</text>

  <!-- 鹤望兰科 + 兰花蕉科 + 蝎尾蕉科 -->
  <line x1="390" y1="90" x2="145" y2="120" stroke="#2c2416" stroke-width="2"/>
  <line x1="145" y1="120" x2="100" y2="150" stroke="#2c2416" stroke-width="1.5"/>
  <g transform="translate(50, 155)">
    <rect x="0" y="0" width="100" height="26" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#4a7c3a">鹤望兰科</text>
  </g>
  <line x1="145" y1="120" x2="145" y2="150" stroke="#2c2416" stroke-width="1.5"/>
  <g transform="translate(95, 155)">
    <rect x="0" y="0" width="100" height="26" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#4a7c3a">兰花蕉科</text>
  </g>
  <line x1="145" y1="120" x2="190" y2="150" stroke="#2c2416" stroke-width="1.5"/>
  <g transform="translate(140, 155)">
    <rect x="0" y="0" width="100" height="26" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#4a7c3a">蝎尾蕉科</text>
  </g>

  <!-- 美人蕉科 + 竹芋科 -->
  <line x1="390" y1="90" x2="635" y2="120" stroke="#2c2416" stroke-width="2"/>
  <line x1="635" y1="120" x2="610" y2="150" stroke="#2c2416" stroke-width="1.5"/>
  <g transform="translate(560, 155)">
    <rect x="0" y="0" width="100" height="26" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#4a7c3a">美人蕉科</text>
  </g>
  <line x1="635" y1="120" x2="660" y2="150" stroke="#2c2416" stroke-width="1.5"/>
  <g transform="translate(610, 155)">
    <rect x="0" y="0" width="100" height="26" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="50" y="18" text-anchor="middle" font-size="9" font-weight="700" fill="#4a7c3a">竹芋科</text>
  </g>

  <!-- 姜科 + 闭鞘姜科 (姊妹群) -->
  <line x1="390" y1="90" x2="390" y2="120" stroke="#2c2416" stroke-width="2"/>
  <line x1="390" y1="120" x2="340" y2="150" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(290, 155)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">姜科</text>
  </g>
  <text x="340" y="200" text-anchor="middle" font-size="8" fill="#c0392b">1枚可育雄蕊</text>
  <text x="340" y="212" text-anchor="middle" font-size="8" fill="#c0392b">唇瓣（退化雄蕊融合）</text>

  <line x1="390" y1="120" x2="440" y2="150" stroke="#c0392b" stroke-width="2"/>
  <g transform="translate(390, 155)">
    <rect x="0" y="0" width="100" height="30" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="50" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">闭鞘姜科</text>
  </g>
  <text x="440" y="200" text-anchor="middle" font-size="8" fill="#c0392b">唇瓣（退化雄蕊融合）</text>

  <!-- 姜科姊妹群标签 -->
  <text x="390" y="235" text-anchor="middle" font-size="9" font-weight="700" fill="#c0392b">&#x25B2; "姜类支系"（Zingiberoid clade）—— 姊妹群关系</text>

  <!-- 演化趋势 -->
  <text x="30" y="265" font-size="11" font-weight="700" fill="#8b4513">B. 可育雄蕊演化趋势</text>
  <g transform="translate(30, 278)">
    <rect x="0" y="0" width="720" height="40" rx="6" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="360" y="16" text-anchor="middle" font-size="10" fill="#2c2416">芭蕉科（5-6枚）&#x2192; 鹤望兰科/兰花蕉科/蝎尾蕉科（5枚）&#x2192; 美人蕉科/竹芋科（1枚可育+退化）&#x2192; 姜科/闭鞘姜科（1枚）</text>
    <text x="360" y="32" text-anchor="middle" font-size="9" fill="#c0392b">演化方向：可育雄蕊数量减少 | 花部结构简化 | 两侧对称增强</text>
  </g>

  <!-- 花图式特征 -->
  <text x="30" y="335" font-size="11" font-weight="700" fill="#8b4513">C. 姜目花图式共有特征</text>
  <g transform="translate(30, 348)">
    <rect x="0" y="0" width="720" height="55" rx="6" fill="#fff8f0" stroke="#8b4513" stroke-width="1.5"/>
    <text x="360" y="16" text-anchor="middle" font-size="10" fill="#2c2416">花通常为两侧对称（zygomorphic），3基数 | 花萼3片，花瓣3片</text>
    <text x="360" y="32" text-anchor="middle" font-size="10" fill="#2c2416">可育雄蕊数量减少是重要演化趋势 | 唇瓣（labellum）= 退化雄蕊融合形成</text>
    <text x="360" y="48" text-anchor="middle" font-size="9" fill="#7a6e5e">花图式建树方法：离散性状编码 &#x2192; 最大简约法/贝叶斯法 &#x2192; 系统发生树</text>
  </g>

  <!-- 竞赛考点 -->
  <rect x="30" y="418" width="720" height="55" rx="6" fill="#fef5f0" stroke="#c0392b" stroke-width="2"/>
  <text x="390" y="438" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">GGBO第21题核心考点</text>
  <text x="390" y="458" text-anchor="middle" font-size="10" fill="#2c2416">姜目8科单系群 | 芭蕉科最基部（可育雄蕊多） | 姜科+闭鞘姜科姊妹群（共享唇瓣） | 可育雄蕊6&#x2192;5&#x2192;1</text>
</svg>