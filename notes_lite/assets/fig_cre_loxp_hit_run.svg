<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="500" fill="#fdfbf7"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">Cre-loxP "Hit and Run" 策略示意图（GGBO第61题）</text>

  <!-- 步骤1: 转基因载体构建 -->
  <text x="30" y="55" font-size="11" font-weight="700" fill="#8b4513">步骤1: 构建转基因载体</text>
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="720" height="30" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="360" y="18" text-anchor="middle" font-size="10" font-family="monospace" fill="#2c2416">[loxP] -- hF3(外源基因) -- [loxP] -- NeoR(正选择) -- TK(负选择)</text>
  </g>

  <!-- 步骤2: 电转染 + G418筛选 -->
  <text x="30" y="115" font-size="11" font-weight="700" fill="#8b4513">步骤2: 电转染 + G418 正选择（获得整合克隆）</text>
  <g transform="translate(30, 125)">
    <rect x="0" y="0" width="720" height="45" rx="5" fill="#fef5f0" stroke="#c0392b" stroke-width="1.5"/>
    <text x="360" y="18" text-anchor="middle" font-size="10" fill="#2c2416">基因组 DNA：... [loxP]-hF3-[loxP]-NeoR-TK ... 整合到宿主染色体</text>
    <text x="360" y="35" text-anchor="middle" font-size="9" fill="#c0392b">G418 筛选：NeoR+ 细胞存活 → 获得阳性整合克隆</text>
  </g>

  <!-- 步骤3: Hit - Cre瞬时表达 -->
  <text x="30" y="195" font-size="11" font-weight="700" fill="#c0392b">步骤3: "Hit" —— 瞬时转染 Cre 表达质粒</text>
  <g transform="translate(30, 205)">
    <rect x="0" y="0" width="720" height="55" rx="5" fill="#fff3cd" stroke="#e8c84a" stroke-width="2"/>
    <text x="360" y="18" text-anchor="middle" font-size="10" fill="#2c2416">Cre 重组酶识别两个 loxP 位点 → 切除 loxP 之间的 hF3-NeoR-TK 片段</text>
    <text x="360" y="35" text-anchor="middle" font-size="10" fill="#2c2416">切除后：... [loxP] ... TK 被切除（NeoR 也被切除）</text>
    <text x="360" y="50" text-anchor="middle" font-size="9" fill="#c0392b">Cre 切除是"Hit"的核心：一击去除标记基因</text>
  </g>

  <!-- 步骤4: Run - FIAU负选择 -->
  <text x="30" y="285" font-size="11" font-weight="700" fill="#c0392b">步骤4: "Run" —— FIAU 负选择（富集 TK- 细胞）</text>
  <g transform="translate(30, 295)">
    <rect x="0" y="0" width="720" height="55" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="360" y="18" text-anchor="middle" font-size="10" fill="#2c2416">FIAU 被 HSV-TK 磷酸化 → 转化为有毒代谢物 → 掺入 DNA → 细胞死亡</text>
    <text x="360" y="35" text-anchor="middle" font-size="10" fill="#2c2416">TK- 细胞（切除成功）→ 存活  |  TK+ 细胞（未切除）→ 死亡</text>
    <text x="360" y="50" text-anchor="middle" font-size="9" fill="#c0392b">负选择"Run"：TK- 细胞在 FIAU 中"跑赢"存活</text>
  </g>

  <!-- 步骤5: 验证 -->
  <text x="30" y="375" font-size="11" font-weight="700" fill="#8b4513">步骤5: 巢式 PCR + Southern Blot 验证切除事件</text>
  <g transform="translate(30, 385)">
    <rect x="0" y="0" width="720" height="35" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="360" y="20" text-anchor="middle" font-size="10" fill="#2c2416">巢式PCR检测切除产物 | Southern blot验证基因组整合状态 | 假阳性判断：PCR条带大小异常→重排/缺失</text>
  </g>

  <!-- 关键总结 -->
  <rect x="30" y="435" width="720" height="55" rx="6" fill="#fff8f0" stroke="#8b4513" stroke-width="2"/>
  <text x="390" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">"Hit and Run" 策略核心记忆</text>
  <text x="390" y="475" text-anchor="middle" font-size="10" fill="#2c2416">Hit = Cre 瞬时切除标记（一击） | Run = FIAU 负选择让 TK- 细胞存活（跑赢） | 正负双选保整合</text>
</svg>