<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" style="font-family: sans-serif;">
  <rect x="0" y="0" width="820" height="500" fill="#fdfbf7"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#2c2416">线粒体超微结构</text>

  <!-- 外膜(椭圆轮廓) -->
  <ellipse cx="340" cy="270" rx="280" ry="170" fill="#fff3cd" opacity="0.4" stroke="#8b4513" stroke-width="3"/>
  <!-- 内膜(折叠成嵴) -->
  <path d="M 110,270 Q 150,180 190,270 Q 230,360 270,270 Q 310,180 350,270 Q 390,360 430,270 Q 470,180 510,270 Q 550,360 570,270" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 内膜主体轮廓 -->
  <path d="M 90,270 Q 90,110 340,110 Q 590,110 590,270 Q 590,430 340,430 Q 90,430 90,270 Z" fill="#f0f7f4" opacity="0.6" stroke="#c0392b" stroke-width="2"/>

  <!-- 嵴标签 -->
  <text x="190" y="200" font-size="10" fill="#c0392b" font-style="italic">嵴(cristae)</text>

  <!-- 基质内容物 -->
  <!-- mtDNA -->
  <ellipse cx="230" cy="300" rx="28" ry="12" fill="none" stroke="#4a7c3a" stroke-width="2"/>
  <path d="M 215,300 q 8,-8 15,0 q 8,8 15,0 q 8,-8 13,0" fill="none" stroke="#4a7c3a" stroke-width="1.5"/>
  <text x="230" y="328" text-anchor="middle" font-size="9" fill="#4a7c3a">mtDNA(环状)</text>

  <!-- 55S核糖体 -->
  <circle cx="320" cy="320" r="9" fill="#8b4513" opacity="0.7"/>
  <circle cx="340" cy="305" r="7" fill="#8b4513" opacity="0.7"/>
  <circle cx="300" cy="335" r="6" fill="#8b4513" opacity="0.7"/>
  <text x="320" y="358" text-anchor="middle" font-size="9" fill="#8b4513">55S核糖体(原核型)</text>

  <!-- 基质颗粒 -->
  <circle cx="410" cy="320" r="6" fill="#d6ccc0" stroke="#8b4513"/>
  <circle cx="425" cy="310" r="5" fill="#d6ccc0" stroke="#8b4513"/>
  <text x="418" y="345" text-anchor="middle" font-size="9" fill="#8b4513">基质颗粒(Ca&#178;&#8314;)</text>

  <!-- TCA酶系标签 -->
  <text x="460" y="300" font-size="9" fill="#2c2416">TCA循环酶系</text>
  <text x="460" y="314" font-size="9" fill="#2c2416">β-氧化酶系</text>

  <!-- ETC + ATP合酶 在内膜上 -->
  <rect x="170" y="135" width="14" height="22" rx="2" fill="#c0392b"/>
  <rect x="200" y="138" width="14" height="19" rx="2" fill="#8b4513"/>
  <rect x="230" y="135" width="14" height="22" rx="2" fill="#4a7c3a"/>
  <rect x="260" y="138" width="14" height="19" rx="2" fill="#2c2416"/>
  <rect x="440" y="138" width="16" height="20" rx="3" fill="#8b4513"/>
  <text x="225" y="128" text-anchor="middle" font-size="9" fill="#c0392b">ETC复合体Ⅰ-Ⅳ</text>
  <text x="448" y="128" text-anchor="middle" font-size="9" fill="#8b4513">ATP合酶</text>

  <!-- 膜间隙 cyt c -->
  <circle cx="150" cy="135" r="4" fill="#5dade2"/>
  <circle cx="380" cy="125" r="4" fill="#5dade2"/>
  <circle cx="510" cy="140" r="4" fill="#5dade2"/>
  <text x="610" y="135" font-size="9" fill="#5dade2" font-weight="700">cyt c</text>

  <!-- 外膜孔蛋白 VDAC -->
  <rect x="120" y="103" width="8" height="6" fill="none" stroke="#8b4513" stroke-width="1.2"/>
  <rect x="135" y="101" width="8" height="6" fill="none" stroke="#8b4513" stroke-width="1.2"/>
  <rect x="500" y="103" width="8" height="6" fill="none" stroke="#8b4513" stroke-width="1.2"/>
  <rect x="515" y="101" width="8" height="6" fill="none" stroke="#8b4513" stroke-width="1.2"/>

  <!-- 标注引线 -->
  <line x1="80" y1="135" x2="115" y2="108" stroke="#7a6e5e" stroke-width="1"/>
  <line x1="100" y1="160" x2="120" y2="135" stroke="#7a6e5e" stroke-width="1"/>
  <line x1="225" y1="125" x2="225" y2="140" stroke="#7a6e5e" stroke-width="1"/>

  <!-- 右侧图例表 -->
  <rect x="640" y="70" width="170" height="370" rx="6" fill="#fff8e7" stroke="#d6ccc0"/>
  <text x="725" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">结构组成</text>
  <text x="655" y="118" font-size="11" fill="#8b4513" font-weight="700">外膜</text>
  <text x="655" y="134" font-size="10" fill="#2c2416">光滑;孔蛋白VDAC</text>
  <text x="655" y="148" font-size="9" fill="#7a6e5e">(<5000Da自由通过)</text>
  <text x="655" y="172" font-size="11" fill="#8b4513" font-weight="700">膜间隙(IMS)</text>
  <text x="655" y="188" font-size="10" fill="#2c2416">cyt c,AIF,质子蓄积</text>
  <text x="655" y="212" font-size="11" fill="#8b4513" font-weight="700">内膜</text>
  <text x="655" y="228" font-size="10" fill="#2c2416">折叠成嵴;心磷脂~20%</text>
  <text x="655" y="242" font-size="10" fill="#2c2416">ETCⅠ-Ⅳ + ATP合酶</text>
  <text x="655" y="256" font-size="9" fill="#7a6e5e">对离子不通透</text>
  <text x="655" y="280" font-size="11" fill="#8b4513" font-weight="700">基质</text>
  <text x="655" y="296" font-size="10" fill="#2c2416">TCA酶系,β-氧化</text>
  <text x="655" y="310" font-size="10" fill="#2c2416">mtDNA,55S核糖体</text>
  <text x="655" y="324" font-size="10" fill="#2c2416">tRNA,Ca&#178;&#8314;颗粒</text>

  <text x="655" y="352" font-size="10" fill="#c0392b" font-weight="700">关键考点:</text>
  <text x="655" y="370" font-size="9" fill="#2c2416">·心磷脂=内共生证据</text>
  <text x="655" y="384" font-size="9" fill="#2c2416">·cyt c释放触发凋亡</text>
  <text x="655" y="398" font-size="9" fill="#2c2416">·嵴增大氧化磷酸化</text>
  <text x="655" y="412" font-size="9" fill="#2c2416">  膜面积</text>
  <text x="655" y="426" font-size="9" fill="#2c2416">·mtDNA 16.6kb,37基因</text>

  <!-- 标签 -->
  <text x="60" y="100" font-size="10" fill="#8b4513" font-weight="700">外膜</text>
  <text x="60" y="155" font-size="10" fill="#8b4513" font-weight="700">膜间隙</text>
  <text x="40" y="270" font-size="10" fill="#c0392b" font-weight="700">内膜/嵴</text>
  <text x="40" y="400" font-size="10" fill="#4a7c3a" font-weight="700">基质</text>
</svg>
