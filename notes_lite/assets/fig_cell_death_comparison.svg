<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="420" fill="#fdfbf7"/>

  <!-- 标题 -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">五种细胞死亡类型总览对比图</text>

  <!-- 细胞列：5个类型横向排列 -->
  <!-- 凋亡 Apoptosis -->
  <g transform="translate(30, 50)">
    <rect x="0" y="0" width="140" height="340" rx="8" fill="#f5f0e8" stroke="#d6ccc0" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#8b4513"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">凋亡 Apoptosis</text>

    <!-- 细胞示意图：皱缩、凋亡小体 -->
    <circle cx="70" cy="85" r="28" fill="#fdfbf7" stroke="#8b4513" stroke-width="2"/>
    <circle cx="45" cy="65" r="8" fill="#d6ccc0" stroke="#8b4513" stroke-width="1"/>
    <circle cx="95" cy="60" r="6" fill="#d6ccc0" stroke="#8b4513" stroke-width="1"/>
    <circle cx="100" cy="90" r="7" fill="#d6ccc0" stroke="#8b4513" stroke-width="1"/>
    <circle cx="50" cy="100" r="5" fill="#d6ccc0" stroke="#8b4513" stroke-width="1"/>
    <!-- 核固缩 -->
    <circle cx="70" cy="85" r="12" fill="#2c2416" opacity="0.6"/>
    <text x="70" y="130" text-anchor="middle" font-size="9" fill="#8b4513" font-weight="600">细胞皱缩·凋亡小体</text>

    <!-- 特征列表 -->
    <line x1="10" y1="142" x2="130" y2="142" stroke="#d6ccc0" stroke-width="1"/>
    <text x="15" y="158" font-size="9.5" fill="#2c2416"><tspan font-weight="600">性质：</tspan>主动·程序性</text>
    <text x="15" y="175" font-size="9.5" fill="#2c2416"><tspan font-weight="600">膜：</tspan>保持完整</text>
    <text x="15" y="192" font-size="9.5" fill="#2c2416"><tspan font-weight="600">炎症：</tspan>无</text>
    <text x="15" y="209" font-size="9.5" fill="#2c2416"><tspan font-weight="600">关键酶：</tspan>caspase-3/7</text>
    <text x="15" y="226" font-size="9.5" fill="#2c2416"><tspan font-weight="600">形态标志：</tspan>凋亡小体</text>
    <text x="15" y="243" font-size="9.5" fill="#2c2416"><tspan font-weight="600">DNA：</tspan>180bp梯状</text>

    <line x1="10" y1="255" x2="130" y2="255" stroke="#d6ccc0" stroke-width="1"/>
    <text x="70" y="273" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4a7c3a">生理功能</text>
    <text x="70" y="290" text-anchor="middle" font-size="9" fill="#2c2416">发育·免疫·稳态</text>
    <text x="70" y="308" text-anchor="middle" font-size="9" fill="#2c2416">肿瘤抑制</text>
    <text x="70" y="328" text-anchor="middle" font-size="9" fill="#8b4513" font-weight="600">I型 PCD</text>
  </g>

  <!-- 焦亡 Pyroptosis -->
  <g transform="translate(185, 50)">
    <rect x="0" y="0" width="140" height="340" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#c0392b"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">焦亡 Pyroptosis</text>

    <!-- 细胞示意图：肿胀、膜孔、内容物释放 -->
    <ellipse cx="70" cy="85" rx="35" ry="30" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <!-- 膜孔 -->
    <ellipse cx="50" cy="110" rx="6" ry="3" fill="#fdfbf7" stroke="#c0392b" stroke-width="1.5"/>
    <ellipse cx="85" cy="112" rx="5" ry="2.5" fill="#fdfbf7" stroke="#c0392b" stroke-width="1.5"/>
    <ellipse cx="90" cy="65" rx="5" ry="2.5" fill="#fdfbf7" stroke="#c0392b" stroke-width="1.5"/>
    <!-- 内容物释放 -->
    <circle cx="30" cy="118" r="3" fill="#e8c84a" opacity="0.8"/>
    <circle cx="110" cy="118" r="3" fill="#e8c84a" opacity="0.8"/>
    <text x="70" y="130" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">细胞肿胀·膜孔·促炎</text>

    <!-- 特征列表 -->
    <line x1="10" y1="142" x2="130" y2="142" stroke="#d6ccc0" stroke-width="1"/>
    <text x="15" y="158" font-size="9.5" fill="#2c2416"><tspan font-weight="600">性质：</tspan>主动·程序性</text>
    <text x="15" y="175" font-size="9.5" fill="#2c2416"><tspan font-weight="600">膜：</tspan>破裂（GSDMD孔）</text>
    <text x="15" y="192" font-size="9.5" fill="#2c2416"><tspan font-weight="600">炎症：</tspan><tspan fill="#c0392b" font-weight="600">有（促炎）</tspan></text>
    <text x="15" y="209" font-size="9.5" fill="#2c2416"><tspan font-weight="600">关键酶：</tspan>caspase-1/4/5/11</text>
    <text x="15" y="226" font-size="9.5" fill="#2c2416"><tspan font-weight="600">标志分子：</tspan>GSDMD</text>
    <text x="15" y="243" font-size="9.5" fill="#2c2416"><tspan font-weight="600">因子：</tspan>IL-1β/IL-18</text>

    <line x1="10" y1="255" x2="130" y2="255" stroke="#d6ccc0" stroke-width="1"/>
    <text x="70" y="273" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4a7c3a">生理功能</text>
    <text x="70" y="290" text-anchor="middle" font-size="9" fill="#2c2416">抗感染免疫</text>
    <text x="70" y="308" text-anchor="middle" font-size="9" fill="#2c2416">炎症反应</text>
    <text x="70" y="328" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">炎性 PCD</text>
  </g>

  <!-- 铁死亡 Ferroptosis -->
  <g transform="translate(340, 50)">
    <rect x="0" y="0" width="140" height="340" rx="8" fill="#fdf9f0" stroke="#8b4513" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#8b4513"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">铁死亡 Ferroptosis</text>

    <!-- 细胞示意图：线粒体皱缩、膜完整 -->
    <circle cx="70" cy="85" r="30" fill="#fdfbf7" stroke="#8b4513" stroke-width="2"/>
    <!-- 线粒体（皱缩变小） -->
    <ellipse cx="55" cy="80" rx="8" ry="5" fill="#2c2416" opacity="0.5" stroke="#8b4513" stroke-width="1"/>
    <ellipse cx="85" cy="88" rx="7" ry="4" fill="#2c2416" opacity="0.5" stroke="#8b4513" stroke-width="1"/>
    <!-- 铁离子 -->
    <text x="65" y="72" font-size="8" fill="#c0392b" font-weight="700">Fe²⁺</text>
    <!-- 脂质过氧化物示意 -->
    <circle cx="70" cy="85" r="3" fill="#c0392b" opacity="0.6"/>
    <circle cx="50" cy="95" r="2" fill="#c0392b" opacity="0.5"/>
    <circle cx="88" cy="75" r="2" fill="#c0392b" opacity="0.5"/>
    <text x="70" y="130" text-anchor="middle" font-size="9" fill="#8b4513" font-weight="600">线粒体皱缩·膜完整</text>

    <!-- 特征列表 -->
    <line x1="10" y1="142" x2="130" y2="142" stroke="#d6ccc0" stroke-width="1"/>
    <text x="15" y="158" font-size="9.5" fill="#2c2416"><tspan font-weight="600">性质：</tspan>主动·程序性</text>
    <text x="15" y="175" font-size="9.5" fill="#2c2416"><tspan font-weight="600">膜：</tspan>完整（早期）</text>
    <text x="15" y="192" font-size="9.5" fill="#2c2416"><tspan font-weight="600">炎症：</tspan>无/弱</text>
    <text x="15" y="209" font-size="9.5" fill="#2c2416"><tspan font-weight="600">关键：</tspan>铁·脂质过氧化</text>
    <text x="15" y="226" font-size="9.5" fill="#2c2416"><tspan font-weight="600">标志酶：</tspan>GPX4失活</text>
    <text x="15" y="243" font-size="9.5" fill="#2c2416"><tspan font-weight="600">凋亡小体：</tspan>无</text>

    <line x1="10" y1="255" x2="130" y2="255" stroke="#d6ccc0" stroke-width="1"/>
    <text x="70" y="273" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4a7c3a">生理功能</text>
    <text x="70" y="290" text-anchor="middle" font-size="9" fill="#2c2416">肿瘤抑制</text>
    <text x="70" y="308" text-anchor="middle" font-size="9" fill="#2c2416">神经退行·缺血损伤</text>
    <text x="70" y="328" text-anchor="middle" font-size="9" fill="#8b4513" font-weight="600">铁依赖型 PCD</text>
  </g>

  <!-- 程序性坏死 Necroptosis -->
  <g transform="translate(495, 50)">
    <rect x="0" y="0" width="140" height="340" rx="8" fill="#fdf5f0" stroke="#c0392b" stroke-width="1.5"/>
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#c0392b"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">程序性坏死</text>
    <text x="70" y="35" text-anchor="middle" font-size="8" fill="#fff">Necroptosis</text>

    <!-- 细胞示意图：肿胀、膜破裂（类似坏死但有程序） -->
    <ellipse cx="70" cy="88" rx="34" ry="28" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <!-- 膜破裂 -->
    <path d="M 45 110 L 55 108 L 60 114 L 70 110 L 80 115 L 90 110 L 95 113" stroke="#c0392b" stroke-width="2" fill="none"/>
    <!-- 内容物外泄 -->
    <circle cx="40" cy="120" r="4" fill="#d6ccc0" opacity="0.7"/>
    <circle cx="100" cy="118" r="3" fill="#d6ccc0" opacity="0.7"/>
    <circle cx="108" cy="110" r="2" fill="#d6ccc0" opacity="0.6"/>
    <text x="70" y="130" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">肿胀·膜破裂·程序性</text>

    <!-- 特征列表 -->
    <line x1="10" y1="142" x2="130" y2="142" stroke="#d6ccc0" stroke-width="1"/>
    <text x="15" y="158" font-size="9.5" fill="#2c2416"><tspan font-weight="600">性质：</tspan>主动·程序性</text>
    <text x="15" y="175" font-size="9.5" fill="#2c2416"><tspan font-weight="600">膜：</tspan>破裂（MLKL孔）</text>
    <text x="15" y="192" font-size="9.5" fill="#2c2416"><tspan font-weight="600">炎症：</tspan><tspan fill="#c0392b" font-weight="600">有</tspan></text>
    <text x="15" y="209" font-size="9.5" fill="#2c2416"><tspan font-weight="600">关键：</tspan>RIPK1/RIPK3/MLKL</text>
    <text x="15" y="226" font-size="9.5" fill="#2c2416"><tspan font-weight="600">caspase：</tspan>不依赖（被抑制）</text>
    <text x="15" y="243" font-size="9.5" fill="#2c2416"><tspan font-weight="600">诱因：</tspan>TNF·病毒感染</text>

    <line x1="10" y1="255" x2="130" y2="255" stroke="#d6ccc0" stroke-width="1"/>
    <text x="70" y="273" text-anchor="middle" font-size="9.5" font-weight="600" fill="#4a7c3a">生理功能</text>
    <text x="70" y="290" text-anchor="middle" font-size="9" fill="#2c2416">抗病毒免疫</text>
    <text x="70" y="308" text-anchor="middle" font-size="9" fill="#2c2416">凋亡被抑制时的备份</text>
    <text x="70" y="328" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">坏死样 PCD</text>
  </g>

  <!-- 坏死 Necrosis -->
  <g transform="translate(650, 50)">
    <rect x="0" y="0" width="120" height="340" rx="8" fill="#f5f0e8" stroke="#7a6e5e" stroke-width="1.5"/>
    <rect x="0" y="0" width="120" height="32" rx="8" fill="#7a6e5e"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">坏死 Necrosis</text>

    <!-- 细胞示意图：肿胀破裂、混乱 -->
    <ellipse cx="60" cy="88" rx="32" ry="26" fill="#fdfbf7" stroke="#7a6e5e" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- 细胞器外泄 -->
    <circle cx="30" cy="100" r="5" fill="#d6ccc0" stroke="#7a6e5e" stroke-width="1"/>
    <circle cx="90" cy="105" r="4" fill="#d6ccc0" stroke="#7a6e5e" stroke-width="1"/>
    <rect x="45" y="78" width="12" height="8" fill="#d6ccc0" stroke="#7a6e5e" stroke-width="1" transform="rotate(20 51 82)"/>
    <text x="60" y="130" text-anchor="middle" font-size="9" fill="#7a6e5e" font-weight="600">肿胀破裂·被动死亡</text>

    <!-- 特征列表 -->
    <line x1="10" y1="142" x2="110" y2="142" stroke="#d6ccc0" stroke-width="1"/>
    <text x="10" y="158" font-size="9.5" fill="#2c2416"><tspan font-weight="600">性质：</tspan>被动·非程序</text>
    <text x="10" y="175" font-size="9.5" fill="#2c2416"><tspan font-weight="600">膜：</tspan>破裂</text>
    <text x="10" y="192" font-size="9.5" fill="#2c2416"><tspan font-weight="600">炎症：</tspan><tspan fill="#c0392b" font-weight="600">有</tspan></text>
    <text x="10" y="209" font-size="9.5" fill="#2c2416"><tspan font-weight="600">ATP：</tspan>耗竭</text>
    <text x="10" y="226" font-size="9.5" fill="#2c2416"><tspan font-weight="600">诱因：</tspan>病理损伤</text>
    <text x="10" y="243" font-size="9.5" fill="#2c2416"><tspan font-weight="600">DNA：</tspan>随机降解</text>

    <line x1="10" y1="255" x2="110" y2="255" stroke="#d6ccc0" stroke-width="1"/>
    <text x="60" y="273" text-anchor="middle" font-size="9.5" font-weight="600" fill="#c0392b">病理意义</text>
    <text x="60" y="290" text-anchor="middle" font-size="9" fill="#2c2416">缺血·毒素·创伤</text>
    <text x="60" y="308" text-anchor="middle" font-size="9" fill="#2c2416">组织损伤</text>
    <text x="60" y="328" text-anchor="middle" font-size="9" fill="#7a6e5e" font-weight="600">被动死亡</text>
  </g>

  <!-- 底部图例说明 -->
  <rect x="30" y="400" width="740" height="16" rx="4" fill="#fff3cd" stroke="#e8c84a" stroke-width="1"/>
  <text x="390" y="412" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8b4513">竞赛要点：凋亡/焦亡/铁死亡/程序性坏死均为程序性死亡（PCD），仅坏死为被动死亡。膜完整性和炎症反应是区分关键。</text>
</svg>
