  <text x="55" y="215" text-anchor="end" font-size="10" font-weight="700" fill="#2c2416">PTEN</text>
  <rect x="70" y="203" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="130" y="203" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="190" y="203" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="250" y="203" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="310" y="203" width="45" height="18" rx="3" fill="#1f78b4"/>
  <rect x="370" y="203" width="45" height="18" rx="3" fill="#d6ccc0"/>
