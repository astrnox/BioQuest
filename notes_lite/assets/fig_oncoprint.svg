  <text x="55" y="100" text-anchor="end" font-size="10" font-weight="700" fill="#2c2416">TP53</text>
  <rect x="70" y="88" width="45" height="18" rx="3" fill="#33a02c"/>
  <rect x="130" y="88" width="45" height="18" rx="3" fill="#33a02c"/>
  <rect x="190" y="88" width="45" height="18" rx="3" fill="#33a02c"/>
