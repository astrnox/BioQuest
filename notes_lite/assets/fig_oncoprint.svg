  <!-- 基因5: IDH1 -->
  <text x="55" y="192" text-anchor="end" font-size="10" font-weight="700" fill="#2c2416">IDH1</text>
  <rect x="70" y="180" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="130" y="180" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="190" y="180" width="45" height="18" rx="3" fill="#1f78b4"/>
