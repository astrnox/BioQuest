  <text x="55" y="123" text-anchor="end" font-size="10" font-weight="700" fill="#2c2416">KRAS</text>
  <rect x="70" y="111" width="45" height="18" rx="3" fill="#33a02c"/>
  <rect x="130" y="111" width="45" height="18" rx="3" fill="#33a02c"/>
  <rect x="190" y="111" width="45" height="18" rx="3" fill="#e31a1c"/>
  <rect x="250" y="111" width="45" height="18" rx="3" fill="#33a02c"/>
  <rect x="310" y="111" width="45" height="18" rx="3" fill="#e31a1c"/>
  <rect x="370" y="111" width="45" height="18" rx="3" fill="#33a02c"/>
