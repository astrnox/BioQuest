  <text x="55" y="169" text-anchor="end" font-size="10" font-weight="700" fill="#2c2416">EGFR</text>
  <rect x="70" y="157" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="130" y="157" width="45" height="18" rx="3" fill="#e31a1c"/>
  <rect x="190" y="157" width="45" height="18" rx="3" fill="#e31a1c"/>
  <rect x="250" y="157" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="310" y="157" width="45" height="18" rx="3" fill="#e31a1c"/>
  <rect x="370" y="157" width="45" height="18" rx="3" fill="#d6ccc0"/>
