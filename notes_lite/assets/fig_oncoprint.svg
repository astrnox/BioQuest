  <rect x="70" y="134" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="130" y="134" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="190" y="134" width="45" height="18" rx="3" fill="#d6ccc0"/>
  <rect x="250" y="134" width="45" height="18" rx="3" fill="#33a02c"/>
  <rect x="310" y="134" width="45" height="18" rx="3" fill="#d6ccc0"/>
