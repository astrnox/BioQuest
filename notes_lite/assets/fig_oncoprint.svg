<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="440" fill="#fdfbf7"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">Oncoprint 癌症基因组学可视化示意图</text>

  <!-- 行列标签 -->
  <text x="390" y="50" text-anchor="middle" font-size="10" fill="#7a6e5e">列 = 患者样本（S1-S10）  |  行 = 基因（每行一个基因）  |  颜色 = 突变类型</text>

  <!-- 样本标签（列） -->
  <text x="100" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S1</text>
  <text x="160" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S2</text>
  <text x="220" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S3</text>
  <text x="280" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S4</text>
  <text x="340" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S5</text>
  <text x="400" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S6</text>
  <text x="460" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S7</text>
  <text x="520" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S8</text>
  <text x="580" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S9</text>
  <text x="640" y="80" text-anchor="middle" font-size="9" font-weight="600" fill="#8b4513">S10</text>

