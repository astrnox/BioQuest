<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="420" fill="#fdfbf7"/>

  <!-- 标题 -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">铁死亡（Ferroptosis）机制示意图</text>

  <!-- 细胞轮廓 -->
  <ellipse cx="390" cy="235" rx="300" ry="155" fill="#fef9f0" stroke="#8b4513" stroke-width="2"/>
  <text x="390" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#8b4513">细胞膜（保持完整）</text>

  <!-- 左侧：铁积累途径 -->
  <text x="150" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">铁积累途径</text>

  <!-- Fe2+ -->
  <g transform="translate(90, 130)">
    <rect x="0" y="0" width="120" height="36" rx="6" fill="#fdf2e9" stroke="#8b4513" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">Fe²⁺ 积累</text>
  </g>

  <!-- 箭头：Fe2+ → Fenton -->
  <path d="M 150 166 L 150 195" stroke="#8b4513" stroke-width="2" fill="none" marker-end="url(#arrow-brown)"/>

  <!-- Fenton反应 -->
  <g transform="translate(75, 200)">
    <rect x="0" y="0" width="150" height="42" rx="6" fill="#fff3cd" stroke="#e8c84a" stroke-width="2"/>
    <text x="75" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#8b4513">Fenton 反应</text>
    <text x="75" y="33" text-anchor="middle" font-size="9" fill="#7a6e5e">Fe²⁺ + H₂O₂ → ·OH + OH⁻</text>
  </g>

  <!-- 箭头：Fenton → ROS -->
  <path d="M 150 242 L 150 270" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- ROS -->
  <g transform="translate(95, 275)">
    <rect x="0" y="0" width="110" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="55" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">ROS 升高</text>
  </g>

  <!-- 中间：脂质过氧化 -->
  <text x="390" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">脂质过氧化（核心）</text>

  <!-- PUFA -->
  <g transform="translate(330, 130)">
    <rect x="0" y="0" width="120" height="32" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#4a7c3a">PUFA（多不饱和脂肪酸）</text>
  </g>

  <!-- 箭头：PUFA → PUFA-OH -->
  <path d="M 390 162 L 390 188" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- PUFA-OH / 脂质过氧化物 -->
  <g transform="translate(315, 193)">
    <rect x="0" y="0" width="150" height="38" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="75" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">脂质过氧化物</text>
    <text x="75" y="31" text-anchor="middle" font-size="9" fill="#7a6e5e">PUFA-OH / MDA / 4-HNE</text>
  </g>

  <!-- 箭头：脂质过氧化物 → 膜损伤 -->
  <path d="M 390 231 L 390 268" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow-red)"/>

  <!-- 细胞膜脂质过氧化损伤 -->
  <g transform="translate(300, 273)">
    <rect x="0" y="0" width="180" height="40" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.5"/>
    <text x="90" y="17" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">细胞膜脂质损伤</text>
    <text x="90" y="32" text-anchor="middle" font-size="9" fill="#7a6e5e">膜完整性破坏 → 铁死亡</text>
  </g>

  <!-- 右侧：GPX4防御系统 -->
  <text x="620" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#4a7c3a">GPX4 防御系统</text>

  <!-- System Xc- -->
  <g transform="translate(560, 130)">
    <rect x="0" y="0" width="120" height="32" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#4a7c3a">System Xc⁻</text>
  </g>

  <!-- 箭头：System Xc- → GSH -->
  <path d="M 620 162 L 620 188" stroke="#4a7c3a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- GSH / 谷胱甘肽 -->
  <g transform="translate(565, 193)">
    <rect x="0" y="0" width="110" height="32" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="55" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#4a7c3a">GSH（谷胱甘肽）</text>
  </g>

  <!-- 箭头：GSH → GPX4 -->
  <path d="M 620 225 L 620 250" stroke="#4a7c3a" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- GPX4 -->
  <g transform="translate(560, 255)">
    <rect x="0" y="0" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="2.5"/>
    <text x="60" y="17" text-anchor="middle" font-size="12" font-weight="700" fill="#4a7c3a">GPX4</text>
    <text x="60" y="32" text-anchor="middle" font-size="9" fill="#7a6e5e">谷胱甘肽过氧化物酶4</text>
  </g>

  <!-- 抑制线：GPX4 --| 脂质过氧化物 (T-bar) -->
  <path d="M 560 275 L 480 293" stroke="#4a7c3a" stroke-width="2.5" fill="none"/>
  <path d="M 480 288 L 480 298" stroke="#4a7c3a" stroke-width="2.5" fill="none"/>
  <text x="510" y="282" font-size="9" fill="#4a7c3a" font-weight="600">降解</text>

  <!-- 诱导剂与抑制剂标注 -->
  <g transform="translate(20, 335)">
    <rect x="0" y="0" width="200" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="100" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">诱导剂（促进铁死亡）</text>
    <text x="100" y="35" text-anchor="middle" font-size="9.5" fill="#2c2416">Erastin → 抑制 System Xc⁻</text>
    <text x="100" y="50" text-anchor="middle" font-size="9.5" fill="#2c2416">RSL3 → 直接抑制 GPX4</text>
  </g>

  <g transform="translate(560, 335)">
    <rect x="0" y="0" width="200" height="55" rx="6" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="100" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#4a7c3a">抑制剂（阻止铁死亡）</text>
    <text x="100" y="35" text-anchor="middle" font-size="9.5" fill="#2c2416">Ferrostatin-1 → 捕获脂质自由基</text>
    <text x="100" y="50" text-anchor="middle" font-size="9.5" fill="#2c2416">去铁胺（DFO）→ 螯合 Fe²⁺</text>
  </g>

  <!-- 底部关键特征 -->
  <rect x="230" y="400" width="320" height="16" rx="4" fill="#fff3cd" stroke="#e8c84a" stroke-width="1"/>
  <text x="390" y="412" text-anchor="middle" font-size="9.5" font-weight="600" fill="#8b4513">关键特征：铁依赖 · 脂质过氧化驱动 · 线粒体皱缩 · 膜完整 · 无凋亡小体</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a7c3a"/>
    </marker>
    <marker id="arrow-brown" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b4513"/>
    </marker>
  </defs>
</svg>
