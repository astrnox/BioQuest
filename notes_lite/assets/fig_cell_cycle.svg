<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" style="font-family: sans-serif;">
  <rect x="0" y="0" width="800" height="520" fill="#fdfbf7"/>
  <text x="400" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#2c2416">细胞增殖周期示意图 (Cell Cycle)</text>
  <text x="400" y="56" text-anchor="middle" font-size="12.5" fill="#7a6e5e">分裂间期(G₁+S+G₂)占 90-95%,分裂期(M)占 5-10%　|　G₀ 期为可逆静止态</text>

  <defs>
    <marker id="cyc" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#c0392b"/></marker>
    <marker id="cyc2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b4513"/></marker>
  </defs>

  <!-- ====== 环形周期 (cx=240 cy=275 R=130 r=82) ====== -->
  <!-- M 期 (250°→290°) -->
  <path d="M 195.5,152.8 A 130 130 0 0 1 284.5,152.8 L 268.0,197.9 A 82 82 0 0 0 212.0,197.9 Z" fill="#d6ccc0" stroke="#2c2416" stroke-width="2"/>
  <!-- G1 期 (290°→60°) -->
  <path d="M 284.5,152.8 A 130 130 0 0 1 305.0,387.6 L 281.0,346.0 A 82 82 0 0 0 268.0,197.9 Z" fill="#d9e8cf" stroke="#4a7c3a" stroke-width="2"/>
  <!-- S 期 (60°→170°) -->
  <path d="M 305.0,387.6 A 130 130 0 0 1 111.9,297.6 L 159.2,289.2 A 82 82 0 0 0 281.0,346.0 Z" fill="#f5cccc" stroke="#c0392b" stroke-width="2"/>
  <!-- G2 期 (170°→250°) -->
  <path d="M 111.9,297.6 A 130 130 0 0 1 195.5,152.8 L 212.0,197.9 A 82 82 0 0 0 159.2,289.2 Z" fill="#e8d8c4" stroke="#8b4513" stroke-width="2"/>

  <!-- 各期标签 (环内) -->
  <text x="240" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#2c2416">M</text>
  <text x="345" y="270" text-anchor="middle" font-size="17" font-weight="700" fill="#4a7c3a">G₁</text>
  <text x="195" y="376" text-anchor="middle" font-size="17" font-weight="700" fill="#c0392b">S</text>
  <text x="148" y="227" text-anchor="middle" font-size="17" font-weight="700" fill="#8b4513">G₂</text>

  <!-- 中心标题 + 方向箭头 -->
  <text x="208" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#7a6e5e">细胞周期</text>
  <text x="208" y="296" text-anchor="middle" font-size="11" fill="#7a6e5e">(顺时针)</text>
  <path d="M 250,300 A 40 40 0 0 1 285,278" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#cyc)"/>

  <!-- 顺时针流向小箭头 (各交界处) -->
  <path d="M 284.5,152.8 L 300,160" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#cyc)"/>
  <path d="M 305,387.6 L 295,375" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#cyc)"/>
  <path d="M 111.9,297.6 L 125,300" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#cyc)"/>
  <path d="M 195.5,152.8 L 188,168" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#cyc)"/>

  <!-- G0 期分支 (从 G1 的 R 点引出) -->
  <path d="M 348,250 C 380,210 410,170 440,150" fill="none" stroke="#8b4513" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#cyc2)"/>
  <text x="362" y="206" font-size="11" fill="#8b4513">R点未通过→</text>
  <rect x="438" y="108" width="116" height="50" rx="10" fill="#fff8e7" stroke="#8b4513" stroke-width="2"/>
  <text x="496" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#8b4513">G₀ 期</text>
  <text x="496" y="148" text-anchor="middle" font-size="10.5" fill="#7a6e5e">暂时脱离周期·可逆静止</text>
  <!-- G0 重新进入 G1 -->
  <path d="M 440,148 C 405,150 360,180 320,205" fill="none" stroke="#8b4513" stroke-width="1.8" marker-end="url(#cyc2)"/>
  <text x="318" y="175" font-size="10.5" fill="#8b4513">←刺激后重新进入</text>

  <!-- ====== 右侧图例 (时间 + 主要事件) ====== -->
  <rect x="438" y="180" width="340" height="318" rx="10" fill="#fdfbf7" stroke="#d6ccc0" stroke-width="1.5"/>
  <text x="458" y="204" font-size="14" font-weight="700" fill="#2c2416">各时相 · 时间 · 主要事件</text>

  <!-- G1 -->
  <rect x="452" y="218" width="20" height="14" fill="#d9e8cf" stroke="#4a7c3a" stroke-width="1.5"/>
  <text x="482" y="230" font-size="13" font-weight="700" fill="#4a7c3a">G₁ 期 (DNA合成前期)</text>
  <text x="482" y="248" font-size="11.5" fill="#2c2416">数小时~数天(变化最大) · 合成 RNA、蛋白质</text>
  <text x="482" y="264" font-size="11.5" fill="#2c2416">含 DNA 复制所需酶 · R点(限制点)决定是否分裂</text>
  <text x="482" y="280" font-size="11.5" fill="#7a6e5e">关键分子:cyclin D-Cdk4/6</text>

  <!-- S -->
  <rect x="452" y="292" width="20" height="14" fill="#f5cccc" stroke="#c0392b" stroke-width="1.5"/>
  <text x="482" y="304" font-size="13" font-weight="700" fill="#c0392b">S 期 (DNA合成期)</text>
  <text x="482" y="322" font-size="11.5" fill="#2c2416">6~8 h · DNA 复制(每条染色体复制一次)</text>
  <text x="482" y="338" font-size="11.5" fill="#2c2416">组蛋白同步合成 · 形成姐妹染色单体(cohesin连接)</text>

  <!-- G2 -->
  <rect x="452" y="352" width="20" height="14" fill="#e8d8c4" stroke="#8b4513" stroke-width="1.5"/>
  <text x="482" y="364" font-size="13" font-weight="700" fill="#8b4513">G₂ 期 (DNA合成后期)</text>
  <text x="482" y="382" font-size="11.5" fill="#2c2416">2~5 h · 合成微管蛋白等有丝分裂所需物质</text>
  <text x="482" y="398" font-size="11.5" fill="#2c2416">G₂/M 检验点:确保 DNA 完整复制后才进入 M</text>

  <!-- M -->
  <rect x="452" y="412" width="20" height="14" fill="#d6ccc0" stroke="#2c2416" stroke-width="1.5"/>
  <text x="482" y="424" font-size="13" font-weight="700" fill="#2c2416">M 期 (分裂期) · 占 5-10%</text>
  <text x="482" y="442" font-size="11.5" fill="#2c2416">有丝分裂(前期→前中期→中期→后期→末期)</text>
  <text x="482" y="458" font-size="11.5" fill="#2c2416">+ 胞质分裂 · 染色体分离与子细胞形成</text>
  <text x="482" y="480" font-size="11" fill="#7a6e5e">检验点:SAC(纺锤体组装检验点)监控赤道板附着</text>

  <text x="400" y="512" text-anchor="middle" font-size="11" fill="#7a6e5e">注:扇形比例为示意,非严格按时间比例。总周期时间因物种/细胞类型而异(酵母~90 min,哺乳动物培养细胞 18-24 h)</text>
</svg>
