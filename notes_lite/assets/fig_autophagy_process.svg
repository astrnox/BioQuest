<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="420" fill="#fdfbf7"/>

  <!-- 标题 -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">巨自噬（Macroautophagy）过程示意图</text>

  <!-- 顶部调控信息 -->
  <g transform="translate(50, 45)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="110" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#c0392b">mTOR 通路 → 抑制自噬</text>
    <text x="110" y="30" text-anchor="middle" font-size="9" fill="#7a6e5e">营养充足时激活，磷酸化ULK1</text>
  </g>
  <g transform="translate(510, 45)">
    <rect x="0" y="0" width="220" height="36" rx="6" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="110" y="16" text-anchor="middle" font-size="10.5" font-weight="700" fill="#4a7c3a">AMPK 通路 → 激活自噬</text>
    <text x="110" y="30" text-anchor="middle" font-size="9" fill="#7a6e5e">能量不足/饥饿时激活</text>
  </g>

  <!-- 步骤1：吞噬泡形成 -->
  <g transform="translate(30, 110)">
    <!-- 背景 -->
    <rect x="0" y="0" width="150" height="200" rx="8" fill="#f5f0e8" stroke="#d6ccc0" stroke-width="1.5"/>
    <rect x="0" y="0" width="150" height="28" rx="8" fill="#8b4513"/>
    <text x="75" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">① 吞噬泡形成</text>
    <text x="75" y="35" text-anchor="middle" font-size="8.5" fill="#8b4513">Phagophore</text>

    <!-- 细胞内示意 -->
    <circle cx="75" cy="130" r="60" fill="#fdfbf7" stroke="#8b4513" stroke-width="1.5"/>

    <!-- 受损线粒体 -->
    <ellipse cx="55" cy="115" rx="15" ry="10" fill="#d6ccc0" stroke="#7a6e5e" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="55" y="118" text-anchor="middle" font-size="7" fill="#7a6e5e">受损线粒体</text>

    <!-- 错误折叠蛋白聚集体 -->
    <circle cx="95" cy="140" r="10" fill="#e8c84a" opacity="0.6" stroke="#8b4513" stroke-width="1"/>
    <text x="95" y="143" text-anchor="middle" font-size="7" fill="#8b4513">蛋白</text>

    <!-- 吞噬泡（双层膜起始） -->
    <path d="M 40 145 Q 55 135 75 140" stroke="#c0392b" stroke-width="2.5" fill="none"/>
    <path d="M 42 152 Q 57 142 77 147" stroke="#c0392b" stroke-width="2.5" fill="none"/>
    <text x="58" y="165" text-anchor="middle" font-size="8" fill="#c0392b" font-weight="600">吞噬泡</text>

    <!-- 关键分子 -->
    <text x="75" y="185" text-anchor="middle" font-size="8.5" fill="#2c2416">ULK1 复合物</text>
    <text x="75" y="197" text-anchor="middle" font-size="8.5" fill="#2c2416">Beclin-1 / VPS34</text>
  </g>

  <!-- 箭头 1→2 -->
  <path d="M 190 210 L 220 210" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="205" y="200" text-anchor="middle" font-size="9" fill="#8b4513">成核</text>

  <!-- 步骤2：自噬体形成 -->
  <g transform="translate(230, 110)">
    <rect x="0" y="0" width="160" height="200" rx="8" fill="#f5f0e8" stroke="#d6ccc0" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#c0392b"/>
    <text x="80" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">② 自噬体形成</text>
    <text x="80" y="35" text-anchor="middle" font-size="8.5" fill="#c0392b">Autophagosome</text>

    <!-- 细胞内示意 -->
    <circle cx="80" cy="130" r="60" fill="#fdfbf7" stroke="#8b4513" stroke-width="1.5"/>

    <!-- 自噬体（双层膜闭合） -->
    <ellipse cx="75" cy="125" rx="32" ry="25" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    <ellipse cx="75" cy="125" rx="28" ry="21" fill="#fef5f0" stroke="#c0392b" stroke-width="1.5"/>
    <text x="75" y="115" text-anchor="middle" font-size="7.5" fill="#c0392b" font-weight="600">双层膜</text>

    <!-- 包裹的内容物 -->
    <ellipse cx="65" cy="128" rx="10" ry="7" fill="#d6ccc0" stroke="#7a6e5e" stroke-width="1"/>
    <circle cx="85" cy="132" r="7" fill="#e8c84a" opacity="0.5" stroke="#8b4513" stroke-width="0.8"/>

    <!-- LC3标记 -->
    <circle cx="50" cy="108" r="4" fill="#c0392b"/>
    <circle cx="100" cy="110" r="4" fill="#c0392b"/>
    <text x="75" y="155" text-anchor="middle" font-size="8" fill="#c0392b" font-weight="600">LC3-II（标志物）</text>

    <!-- 关键分子 -->
    <text x="80" y="180" text-anchor="middle" font-size="8.5" fill="#2c2416">ATG 蛋白家族</text>
    <text x="80" y="193" text-anchor="middle" font-size="8.5" fill="#2c2416">LC3 脂化（I→II）</text>
  </g>

  <!-- 箭头 2→3 -->
  <path d="M 400 210 L 430 210" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="415" y="200" text-anchor="middle" font-size="9" fill="#8b4513">延伸·闭合</text>

  <!-- 步骤3：自噬溶酶体 -->
  <g transform="translate(440, 110)">
    <rect x="0" y="0" width="160" height="200" rx="8" fill="#f5f0e8" stroke="#d6ccc0" stroke-width="1.5"/>
    <rect x="0" y="0" width="160" height="28" rx="8" fill="#4a7c3a"/>
    <text x="80" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">③ 自噬溶酶体</text>
    <text x="80" y="35" text-anchor="middle" font-size="8.5" fill="#4a7c3a">Autolysosome</text>

    <!-- 细胞内示意 -->
    <circle cx="80" cy="130" r="60" fill="#fdfbf7" stroke="#8b4513" stroke-width="1.5"/>

    <!-- 溶酶体 -->
    <circle cx="115" cy="100" r="14" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="2"/>
    <text x="115" y="103" text-anchor="middle" font-size="7" fill="#4a7c3a" font-weight="600">溶酶体</text>

    <!-- 融合过程 -->
    <ellipse cx="70" cy="130" rx="30" ry="24" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="2.5"/>
    <text x="70" y="120" text-anchor="middle" font-size="7.5" fill="#4a7c3a" font-weight="600">融合</text>

    <!-- 降解中的内容物 -->
    <ellipse cx="65" cy="132" rx="10" ry="6" fill="#d6ccc0" opacity="0.5" stroke="#7a6e5e" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="80" cy="138" r="5" fill="#e8c84a" opacity="0.3" stroke="#8b4513" stroke-width="0.5"/>

    <text x="70" y="158" text-anchor="middle" font-size="8" fill="#4a7c3a" font-weight="600">溶酶体酶降解</text>

    <!-- 关键分子 -->
    <text x="80" y="180" text-anchor="middle" font-size="8.5" fill="#2c2416">LAMP-2A</text>
    <text x="80" y="193" text-anchor="middle" font-size="8.5" fill="#2c2416">溶酶体水解酶</text>
  </g>

  <!-- 箭头 3→4 -->
  <path d="M 610 210 L 640 210" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="625" y="200" text-anchor="middle" font-size="9" fill="#8b4513">降解</text>

  <!-- 步骤4：降解产物回收 -->
  <g transform="translate(650, 110)">
    <rect x="0" y="0" width="110" height="200" rx="8" fill="#f5f0e8" stroke="#d6ccc0" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="28" rx="8" fill="#8b4513"/>
    <text x="55" y="19" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">④ 产物回收</text>
    <text x="55" y="35" text-anchor="middle" font-size="8.5" fill="#8b4513">Recycling</text>

    <!-- 细胞内示意 -->
    <circle cx="55" cy="130" r="50" fill="#fdfbf7" stroke="#8b4513" stroke-width="1.5"/>

    <!-- 自噬溶酶体（缩小） -->
    <ellipse cx="55" cy="125" rx="18" ry="14" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="55" y="128" text-anchor="middle" font-size="7" fill="#4a7c3a">残余</text>

    <!-- 释放的氨基酸/脂质 -->
    <circle cx="30" cy="150" r="3" fill="#4a7c3a"/>
    <circle cx="80" cy="145" r="3" fill="#4a7c3a"/>
    <circle cx="40" cy="160" r="2.5" fill="#4a7c3a"/>
    <circle cx="70" cy="162" r="2.5" fill="#4a7c3a"/>
    <text x="55" y="175" text-anchor="middle" font-size="8" fill="#4a7c3a" font-weight="600">氨基酸·脂质</text>

    <text x="55" y="193" text-anchor="middle" font-size="8.5" fill="#2c2416">再利用供能</text>
  </g>

  <!-- 底部：三种自噬类型对比 -->
  <g transform="translate(30, 340)">
    <rect x="0" y="0" width="720" height="60" rx="8" fill="#fff3cd" stroke="#e8c84a" stroke-width="1.5"/>
    <text x="360" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#8b4513">自噬的三种类型</text>
    <text x="120" y="38" text-anchor="middle" font-size="10" fill="#2c2416"><tspan font-weight="600" fill="#c0392b">巨自噬</tspan>：双层膜自噬体包裹 → 溶酶体融合</text>
    <text x="360" y="38" text-anchor="middle" font-size="10" fill="#2c2416"><tspan font-weight="600" fill="#c0392b">微自噬</tspan>：溶酶体膜直接内吞胞质成分</text>
    <text x="600" y="38" text-anchor="middle" font-size="10" fill="#2c2416"><tspan font-weight="600" fill="#c0392b">CMA</tspan>：分子伴侣识别 → LAMP-2A转运</text>
    <text x="120" y="55" text-anchor="middle" font-size="9" fill="#7a6e5e">主要形式 · 降解大底物</text>
    <text x="360" y="55" text-anchor="middle" font-size="9" fill="#7a6e5e">溶酶体直接吞噬</text>
    <text x="600" y="55" text-anchor="middle" font-size="9" fill="#7a6e5e">选择性 · KFERQ序列底物</text>
  </g>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
