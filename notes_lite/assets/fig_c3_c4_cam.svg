<text x="260" y="295" text-anchor="middle" fill="#fff" font-size="9px" font-weight="bold">PEP
羧化酶</text>
<line x1="120" y1="295" x2="190" y2="295" stroke="#333" stroke-width="2"/>
<polygon points="190,295 198.01143615546934,289.01527855896046 198.01143615546934,300.98472144103954" fill="#333"/>
