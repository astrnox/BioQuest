<ellipse cx="330" cy="130" rx="14" ry="9.799999999999999" fill="#32cd32" stroke="#006400"/>
<ellipse cx="395" cy="130" rx="14" ry="9.799999999999999" fill="#32cd32" stroke="#006400"/>
<text x="260" y="130" text-anchor="middle" fill="#fff" font-size="10px" font-weight="bold">RuBisCO</text>
<text x="330" y="130" text-anchor="middle" fill="#fff" font-size="10px" font-weight="bold">卡尔文
循环</text>
<line x1="120" y1="130" x2="190" y2="130" stroke="#333" stroke-width="2"/>
<polygon points="190,130 198.01143615546934,124.01527855896043 198.01143615546934,135.98472144103957" fill="#333"/>
