<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" style="background:#ffffff;font-family:"Noto Sans CJK SC", "WenQuanYi Micro Hei", "Microsoft YaHei", sans-serif;font-size:14px;">
<text x="500.0" y="30" text-anchor="middle" fill="#1a1a1a" font-size="18px" font-weight="bold">C3、C4 与 CAM 光合作用途径比较</text>
<text x="80" y="95" text-anchor="middle" fill="#1a1a1a" font-size="15px" font-weight="bold">C3 途径</text>
