<path d="M 460 240 Q 450 295.0 460 350 L 680 350 Q 690 295.0 680 240 Z" fill="#f0fff0" stroke="#228b22" stroke-width="2"/>
<text x="570.0" y="230" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">维管束鞘细胞</text>
<ellipse cx="540" cy="295" rx="18" ry="12.6" fill="#32cd32" stroke="#006400"/>
<text x="540" y="295" text-anchor="middle" fill="#fff" font-size="10px" font-weight="bold">RuBisCO
卡尔文循环</text>
<line x1="400" y1="295" x2="460" y2="295" stroke="#d62728" stroke-width="2"/>
<polygon points="460,295 468.0114361554693,289.01527855896046 468.0114361554693,300.98472144103954" fill="#d62728"/>
<text x="430" y="280" text-anchor="middle" fill="#d62728" font-size="12px" font-weight="normal">C4 酸</text>
<line x1="490" y1="325" x2="520" y2="325" stroke="#d62728" stroke-width="2"/>
<polygon points="520,325 528.0114361554694,319.01527855896046 528.0114361554694,330.98472144103954" fill="#d62728"/>
<text x="505" y="345" text-anchor="middle" fill="#d62728" font-size="11px" font-weight="normal">脱羧释放 CO₂</text>
<text x="720" y="295" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="normal">花环结构：CO₂ 先被 PEP 羧化酶固定，再转运至维管束鞘
细胞脱羧浓缩，提高 RuBisCO 羧化效率</text>
<text x="80" y="435" text-anchor="middle" fill="#1a1a1a" font-size="15px" font-weight="bold">CAM 途径</text>
