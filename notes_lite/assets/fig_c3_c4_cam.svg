<ellipse cx="360" cy="480" rx="90" ry="45" fill="#fffacd" stroke="#daa520"/>
<text x="360" y="480" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">液泡</text>
<text x="220" y="520" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">夜间</text>
<line x1="120" y1="515" x2="190" y2="515" stroke="#1f77b4" stroke-width="2"/>
<polygon points="190,515 198.01143615546934,509.01527855896046 198.01143615546934,520.9847214410396" fill="#1f77b4"/>
<text x="90" y="510" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="normal">CO₂</text>
<text x="230" y="535" text-anchor="middle" fill="#1a1a1a" font-size="11px" font-weight="normal">气孔开放 → 苹果酸储存于液泡</text>
<text x="470" y="520" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">白天</text>
<line x1="430" y1="475" x2="490" y2="475" stroke="#d62728" stroke-width="2"/>
<polygon points="490,475 498.0114361554693,469.01527855896046 498.0114361554693,480.98472144103954" fill="#d62728"/>
<text x="450" y="460" text-anchor="middle" fill="#d62728" font-size="11px" font-weight="normal">苹果酸脱羧</text>
<text x="505" y="535" text-anchor="middle" fill="#1a1a1a" font-size="11px" font-weight="normal">气孔关闭 → CO₂ 释放进入卡尔文循环</text>
<text x="620" y="475" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="normal">昼夜节律：夜间固定、白天还原</text>
<rect x="80" y="580" width="840" height="110" fill="#f5f5f5" stroke="#999" rx="0"/>
<text x="120" y="610" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">特征</text>
<text x="280" y="610" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">C3</text>
<text x="460" y="610" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">C4</text>
<text x="660" y="610" text-anchor="middle" fill="#1a1a1a" font-size="13px" font-weight="bold">CAM</text>
<line x1="80" y1="620" x2="920" y2="620" stroke="#999" stroke-width="1" />
<text x="120" y="645" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">CO₂ 最初受体</text>
<text x="280" y="645" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">RuBP</text>
<text x="460" y="645" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">PEP</text>
<text x="660" y="645" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">PEP</text>
<text x="120" y="667" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">最初产物</text>
<text x="280" y="667" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">3-PGA</text>
<text x="460" y="667" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">草酰乙酸/苹果酸</text>
<text x="660" y="667" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">草酰乙酸/苹果酸</text>
<text x="120" y="689" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">解剖特征</text>
<text x="280" y="689" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">无花环结构</text>
<text x="460" y="689" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">花环结构（Kranz）</text>
<text x="660" y="689" text-anchor="middle" fill="#1a1a1a" font-size="12px" font-weight="normal">无，液泡大</text>
