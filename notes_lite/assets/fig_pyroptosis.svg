<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="420" fill="#fdfbf7"/>

  <!-- 标题 -->
  <text x="390" y="30" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">细胞焦亡（Pyroptosis）分子机制示意图</text>

  <!-- 细胞轮廓 -->
  <ellipse cx="390" cy="230" rx="280" ry="150" fill="#fef5f0" stroke="#c0392b" stroke-width="2.5"/>
  <text x="390" y="95" text-anchor="middle" font-size="11" font-weight="600" fill="#8b4513">细胞膜</text>

  <!-- 经典途径 (左侧) -->
  <text x="180" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">经典途径</text>

  <!-- 炎症小体 -->
  <g transform="translate(110, 140)">
    <rect x="0" y="0" width="140" height="45" rx="8" fill="#fff3cd" stroke="#e8c84a" stroke-width="2"/>
    <text x="70" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#8b4513">炎症小体</text>
    <text x="70" y="35" text-anchor="middle" font-size="9" fill="#7a6e5e">NLRP3 / ASC / pro-caspase-1</text>
  </g>

  <!-- 箭头：炎症小体 → caspase-1 -->
  <path d="M 180 185 L 180 210" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- caspase-1 -->
  <g transform="translate(130, 215)">
    <rect x="0" y="0" width="100" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="50" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">caspase-1</text>
  </g>

  <!-- 非经典途径 (右侧) -->
  <text x="600" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">非经典途径</text>

  <!-- LPS -->
  <g transform="translate(555, 140)">
    <rect x="0" y="0" width="90" height="36" rx="6" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="2"/>
    <text x="45" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#4a7c3a">LPS</text>
  </g>

  <!-- 箭头：LPS → caspase-4/5/11 -->
  <path d="M 600 176 L 600 200" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- caspase-4/5/11 -->
  <g transform="translate(540, 205)">
    <rect x="0" y="0" width="120" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="60" y="22" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">caspase-4/5/11</text>
  </g>

  <!-- 共同下游：GSDMD -->
  <g transform="translate(320, 270)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.5"/>
    <text x="70" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">GSDMD 打孔</text>
    <text x="70" y="33" text-anchor="middle" font-size="9" fill="#7a6e5e">Gasdermin D N端结构域</text>
  </g>

  <!-- 箭头：caspase-1 → GSDMD -->
  <path d="M 200 251 L 300 275" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <!-- 箭头：caspase-4/5/11 → GSDMD -->
  <path d="M 580 241 L 480 275" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 膜孔（细胞膜上的孔洞） -->
  <g>
    <ellipse cx="200" cy="370" rx="30" ry="12" fill="#fdfbf7" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
    <ellipse cx="390" cy="375" rx="35" ry="14" fill="#fdfbf7" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
    <ellipse cx="580" cy="370" rx="30" ry="12" fill="#fdfbf7" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="390" y="400" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="600">膜孔形成 → 细胞肿胀 → 内容物释放</text>
  </g>

  <!-- 箭头：GSDMD → 膜孔 -->
  <path d="M 390 310 L 390 360" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 促炎因子释放 -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="80" height="32" rx="5" fill="#fff3cd" stroke="#e8c84a" stroke-width="1.5"/>
    <text x="40" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#8b4513">IL-1β</text>
  </g>
  <g transform="translate(650, 340)">
    <rect x="0" y="0" width="80" height="32" rx="5" fill="#fff3cd" stroke="#e8c84a" stroke-width="1.5"/>
    <text x="40" y="20" text-anchor="middle" font-size="10" font-weight="600" fill="#8b4513">IL-18</text>
  </g>

  <!-- 箭头：膜孔 → IL释放 -->
  <path d="M 210 365 Q 120 360 90 350" stroke="#e8c84a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrowhead-yellow)"/>
  <path d="M 570 365 Q 660 360 690 350" stroke="#e8c84a" stroke-width="1.5" fill="none" stroke-dasharray="3,2" marker-end="url(#arrowhead-yellow)"/>

  <!-- 底部生理意义 -->
  <rect x="140" y="403" width="500" height="14" rx="4" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1"/>
  <text x="390" y="414" text-anchor="middle" font-size="9" font-weight="600" fill="#4a7c3a">生理意义：抗感染免疫 · 促进炎症反应 · 清除胞内病原体</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
    <marker id="arrowhead-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8c84a"/>
    </marker>
  </defs>
</svg>
