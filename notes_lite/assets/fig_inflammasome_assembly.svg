<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="460" fill="#fdfbf7"/>
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#c0392b">炎性小体（Inflammasome）组装与激活通路</text>

  <!-- 第一信号：Priming -->
  <text x="30" y="55" font-size="11" font-weight="700" fill="#8b4513">第一信号（启动/Priming）</text>
  <g transform="translate(30, 65)">
    <rect x="0" y="0" width="340" height="45" rx="8" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="2"/>
    <text x="170" y="18" text-anchor="middle" font-size="10" fill="#2c2416">TLR配体（LPS等）</text>
    <text x="170" y="34" text-anchor="middle" font-size="9" fill="#2c2416">&#x2192; NF-&#x3BA;B 活化 &#x2192; 上调 NLRP3 + pro-IL-1&#x3B2; 转录</text>
  </g>

  <text x="380" y="88" font-size="10" fill="#c0392b">&#x2193;</text>

  <!-- 第二信号：Activation -->
  <text x="30" y="125" font-size="11" font-weight="700" fill="#8b4513">第二信号（激活/Activation）</text>
  <g transform="translate(30, 135)">
    <rect x="0" y="0" width="340" height="45" rx="8" fill="#fff3cd" stroke="#e8c84a" stroke-width="2"/>
    <text x="170" y="18" text-anchor="middle" font-size="10" fill="#2c2416">ATP / Nigericin / 尿酸晶体 / 明矾</text>
    <text x="170" y="34" text-anchor="middle" font-size="9" fill="#2c2416">&#x2192; NLRP3 构象变化 &#x2192; 寡聚化</text>
  </g>

  <text x="380" y="158" text-anchor="middle" font-size="10" fill="#c0392b">&#x2193;</text>

  <!-- NLRP3 inflammasome assembly -->
  <text x="30" y="195" font-size="11" font-weight="700" fill="#c0392b">NLRP3 炎性小体组装（核心步骤）</text>
  <g transform="translate(30, 205)">
    <rect x="0" y="0" width="720" height="80" rx="8" fill="#fef5f0" stroke="#c0392b" stroke-width="2.5"/>
    <!-- NLRP3 -->
    <rect x="15" y="15" width="140" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="85" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">NLRP3</text>
    <text x="85" y="50" text-anchor="middle" font-size="8" fill="#7a6e5e">传感器 (NACHT+PYD)</text>
    <!-- 箭头 NLRP3 -> ASC -->
    <text x="162" y="42" text-anchor="middle" font-size="14" fill="#c0392b">&#x2192;</text>
    <!-- ASC -->
    <rect x="180" y="15" width="140" height="50" rx="8" fill="#fff3cd" stroke="#e8c84a" stroke-width="2"/>
    <text x="250" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#8b4513">ASC</text>
    <text x="250" y="50" text-anchor="middle" font-size="8" fill="#7a6e5e">接头蛋白 (PYD+CARD)</text>
    <!-- 箭头 ASC -> pro-caspase-1 -->
    <text x="327" y="42" text-anchor="middle" font-size="14" fill="#c0392b">&#x2192;</text>
    <!-- pro-caspase-1 -->
    <rect x="345" y="15" width="160" height="50" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="425" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">pro-caspase-1</text>
    <text x="425" y="50" text-anchor="middle" font-size="8" fill="#7a6e5e">效应蛋白 (CARD)</text>
    <!-- 组装结果 -->
    <text x="545" y="42" text-anchor="middle" font-size="14" fill="#c0392b">&#x2192;</text>
    <rect x="570" y="18" width="160" height="44" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2.5"/>
    <text x="650" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">NLRP3炎性小体</text>
  </g>

  <text x="200" y="278" text-anchor="end" font-size="10" fill="#c0392b">&#x2198;</text>
  <text x="580" y="278" text-anchor="start" font-size="10" fill="#c0392b">&#x2199;</text>

  <!-- 下游效应 -->
  <text x="30" y="305" font-size="11" font-weight="700" fill="#8b4513">下游效应</text>

  <!-- 活性caspase-1 -->
  <g transform="translate(270, 315)">
    <rect x="0" y="0" width="240" height="40" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/>
    <text x="120" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">活性 caspase-1（自剪切激活）</text>
  </g>

  <text x="310" y="350" text-anchor="end" font-size="10" fill="#c0392b">&#x2198;</text>
  <text x="470" y="350" text-anchor="start" font-size="10" fill="#c0392b">&#x2199;</text>

  <!-- 两个下游分支 -->
  <g transform="translate(60, 365)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#fef5f0" stroke="#c0392b" stroke-width="2"/>
    <text x="150" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">切割 GSDMD</text>
    <text x="150" y="35" text-anchor="middle" font-size="9" fill="#2c2416">GSDMD-N 打孔 &#x2192; 细胞焦亡</text>
  </g>

  <g transform="translate(420, 365)">
    <rect x="0" y="0" width="300" height="50" rx="8" fill="#fff3cd" stroke="#e8c84a" stroke-width="2"/>
    <text x="150" y="18" text-anchor="middle" font-size="10" font-weight="700" fill="#8b4513">切割 pro-IL-1&#x3B2; / pro-IL-18</text>
    <text x="150" y="35" text-anchor="middle" font-size="9" fill="#2c2416">成熟 IL-1&#x3B2; + IL-18 释放 &#x2192; 炎症</text>
  </g>

  <!-- 非经典通路 -->
  <rect x="30" y="425" width="720" height="28" rx="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
  <text x="390" y="444" text-anchor="middle" font-size="10" font-weight="600" fill="#4a7c3a">非经典通路：胞内LPS &#x2192; caspase-4/5/11 直接切割 GSDMD &#x2192; 焦亡（不依赖 NLRP3）</text>
</svg>