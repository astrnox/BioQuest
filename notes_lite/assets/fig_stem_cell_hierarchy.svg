<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" style="font-family: sans-serif;">
  <rect x="0" y="0" width="820" height="580" fill="#fdfbf7"/>
  <text x="410" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#2c2416">干细胞分化层级 (Stem Cell Differentiation Hierarchy)</text>
  <text x="410" y="54" text-anchor="middle" font-size="12.5" fill="#7a6e5e">干细胞两大特性:自我更新(self-renewal)+分化(differentiation)　|　随分化进行:潜能↓ 自我更新能力↓ 特化程度↑</text>

  <defs>
    <marker id="sca" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8b4513"/></marker>
    <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c3a"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>
  </defs>

  <!-- 左侧潜能梯度轴 -->
  <rect x="22" y="80" width="22" height="410" fill="url(#potGrad)" rx="6"/>
  <text x="33" y="74" text-anchor="middle" font-size="11" font-weight="700" fill="#4a7c3a">潜能高</text>
  <text x="33" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">潜能低</text>
  <text x="40" y="295" font-size="11" fill="#7a6e5e" transform="rotate(-90 40 295)">分化潜能 / 自我更新</text>

  <!-- ====== 层级框 (x=70 w=350) ====== -->
  <!-- 1 全能 -->
  <rect x="70" y="80" width="350" height="72" rx="10" fill="#d9e8cf" stroke="#4a7c3a" stroke-width="2"/>
  <text x="84" y="106" font-size="15" font-weight="700" fill="#4a7c3a">全能干细胞 Totipotent</text>
  <text x="84" y="126" font-size="12" fill="#2c2416">特征:能发育成完整个体 + 胚外组织(胎盘等)</text>
  <text x="84" y="143" font-size="12" fill="#2c2416">最高潜能 → 可形成所有细胞类型</text>

  <!-- 2 多能 -->
  <rect x="70" y="180" width="350" height="72" rx="10" fill="#fff8e7" stroke="#8b4513" stroke-width="2"/>
  <text x="84" y="206" font-size="15" font-weight="700" fill="#8b4513">多能干细胞 Pluripotent</text>
  <text x="84" y="226" font-size="12" fill="#2c2416">特征:能分化为三胚层(内/中/外胚层)所有细胞</text>
  <text x="84" y="243" font-size="12" fill="#2c2416">不能独立形成完整个体(缺胚外组织)</text>

  <!-- 3 多潜能 -->
  <rect x="70" y="280" width="350" height="72" rx="10" fill="#fff8e7" stroke="#8b4513" stroke-width="2"/>
  <text x="84" y="306" font-size="15" font-weight="700" fill="#8b4513">多潜能干细胞 Multipotent</text>
  <text x="84" y="326" font-size="12" fill="#2c2416">特征:限于某一组织/系统内多种细胞</text>
  <text x="84" y="343" font-size="12" fill="#2c2416">潜能进一步受限</text>

  <!-- 4 单能 -->
  <rect x="70" y="380" width="350" height="72" rx="10" fill="#f5cccc" stroke="#c0392b" stroke-width="2"/>
  <text x="84" y="406" font-size="15" font-weight="700" fill="#c0392b">单能干细胞 Unipotent</text>
  <text x="84" y="426" font-size="12" fill="#2c2416">特征:只能分化为一种(或一类)细胞</text>
  <text x="84" y="443" font-size="12" fill="#2c2416">仍具自我更新能力(区别于前体细胞)</text>

  <!-- 5 终末分化 -->
  <rect x="70" y="480" width="350" height="72" rx="10" fill="#d6ccc0" stroke="#2c2416" stroke-width="2"/>
  <text x="84" y="506" font-size="15" font-weight="700" fill="#2c2416">终末分化细胞 Terminally differentiated</text>
  <text x="84" y="526" font-size="12" fill="#2c2416">特征:高度特化,通常退出细胞周期不再分裂</text>
  <text x="84" y="543" font-size="12" fill="#2c2416">执行特定生理功能</text>

  <!-- 分化箭头 -->
  <path d="M245,152 L245,176" stroke="#8b4513" stroke-width="2.4" marker-end="url(#sca)"/>
  <path d="M245,252 L245,276" stroke="#8b4513" stroke-width="2.4" marker-end="url(#sca)"/>
  <path d="M245,352 L245,376" stroke="#8b4513" stroke-width="2.4" marker-end="url(#sca)"/>
  <path d="M245,452 L245,476" stroke="#8b4513" stroke-width="2.4" marker-end="url(#sca)"/>
  <text x="252" y="168" font-size="11" fill="#8b4513">分化</text>
  <text x="252" y="268" font-size="11" fill="#8b4513">分化</text>
  <text x="252" y="368" font-size="11" fill="#8b4513">分化</text>
  <text x="252" y="468" font-size="11" fill="#8b4513">分化</text>

  <!-- ====== 右侧实例 (x=445) ====== -->
  <text x="455" y="98" font-size="13" font-weight="700" fill="#2c2416">典型来源 / 实例</text>

  <!-- 全能实例 -->
  <line x1="420" y1="116" x2="448" y2="116" stroke="#4a7c3a" stroke-width="1.4"/>
  <rect x="450" y="92" width="330" height="56" rx="8" fill="#f4faf0" stroke="#4a7c3a" stroke-width="1.2"/>
  <text x="462" y="112" font-size="12" fill="#2c2416">受精卵(zygote)、早期卵裂球(2~8细胞期)</text>
  <text x="462" y="132" font-size="12" fill="#2c2416">→ 可经胚胎发育形成完整个体</text>

  <!-- 多能实例 -->
  <line x1="420" y1="216" x2="448" y2="216" stroke="#8b4513" stroke-width="1.4"/>
  <rect x="450" y="192" width="330" height="56" rx="8" fill="#fffdf3" stroke="#8b4513" stroke-width="1.2"/>
  <text x="462" y="212" font-size="12" fill="#2c2416">囊胚内细胞团(ICM)、胚胎干细胞(ESC)</text>
  <text x="462" y="232" font-size="12" fill="#2c2416">→ 三胚层所有细胞(iPS细胞经诱导重返此态)</text>

  <!-- 多潜能实例 -->
  <line x1="420" y1="316" x2="448" y2="316" stroke="#8b4513" stroke-width="1.4"/>
  <rect x="450" y="292" width="330" height="56" rx="8" fill="#fffdf3" stroke="#8b4513" stroke-width="1.2"/>
  <text x="462" y="312" font-size="12" fill="#2c2416">造血干细胞(HSC)、间充质干细胞</text>
  <text x="462" y="332" font-size="12" fill="#2c2416">→ HSC:红细胞/白细胞/血小板等血细胞</text>

  <!-- 单能实例 -->
  <line x1="420" y1="416" x2="448" y2="416" stroke="#c0392b" stroke-width="1.4"/>
  <rect x="450" y="392" width="330" height="56" rx="8" fill="#fdf3f1" stroke="#c0392b" stroke-width="1.2"/>
  <text x="462" y="412" font-size="12" fill="#2c2416">表皮基底细胞、精原干细胞</text>
  <text x="462" y="432" font-size="12" fill="#2c2416">→ 分别只形成角质形成细胞 / 精子</text>

  <!-- 终末分化实例 -->
  <line x1="420" y1="516" x2="448" y2="516" stroke="#2c2416" stroke-width="1.4"/>
  <rect x="450" y="492" width="330" height="56" rx="8" fill="#f6f3ef" stroke="#2c2416" stroke-width="1.2"/>
  <text x="462" y="512" font-size="12" fill="#2c2416">成熟红细胞、神经元、骨骼肌纤维</text>
  <text x="462" y="532" font-size="12" fill="#2c2416">→ 高度特化,不再分裂(部分可去分化/转分化)</text>

  <text x="410" y="568" text-anchor="middle" font-size="11" fill="#7a6e5e">注:iPS(诱导多能干细胞)技术可将体细胞重编程回到多能态(逆转分化方向);去分化/转分化/跨分化均可打破单向层级</text>
</svg>
