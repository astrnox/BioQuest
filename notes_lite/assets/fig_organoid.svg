<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" style="font-family: 'Noto Sans CJK SC', sans-serif;">
  <rect x="0" y="0" width="780" height="420" fill="#fdfbf7"/>

  <!-- 标题 -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">类器官（Organoid）培养流程与应用示意图</text>

  <!-- 左侧：培养流程 -->
  <text x="200" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#8b4513">培养流程</text>

  <!-- 步骤1：干细胞/组织来源 -->
  <g transform="translate(40, 75)">
    <rect x="0" y="0" width="160" height="50" rx="8" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="2"/>
    <text x="80" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#4a7c3a">① 干细胞/成体组织</text>
    <text x="80" y="35" text-anchor="middle" font-size="9" fill="#7a6e5e">ES细胞 · iPS细胞 · 组织干细胞</text>
    <text x="80" y="47" text-anchor="middle" font-size="9" fill="#7a6e5e">分离并制备单细胞悬液</text>
  </g>

  <!-- 箭头 1→2 -->
  <path d="M 120 125 L 120 148" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="140" y="142" font-size="9" fill="#8b4513">3D培养</text>

  <!-- 步骤2：3D培养+基质胶 -->
  <g transform="translate(40, 155)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#fef5f0" stroke="#8b4513" stroke-width="2"/>
    <text x="80" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#8b4513">② 3D培养体系</text>
    <text x="80" y="33" text-anchor="middle" font-size="9" fill="#2c2416">基质胶（Matrigel）包埋</text>
    <text x="80" y="46" text-anchor="middle" font-size="9" fill="#2c2416">添加生长因子组合</text>
    <text x="80" y="58" text-anchor="middle" font-size="9" fill="#7a6e5e">EGF · FGF · Wnt · Noggin 等</text>
  </g>

  <!-- 箭头 2→3 -->
  <path d="M 120 210 L 120 235" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="140" y="228" font-size="9" fill="#8b4513">自组装</text>

  <!-- 步骤3：类器官形成 -->
  <g transform="translate(40, 242)">
    <rect x="0" y="0" width="160" height="55" rx="8" fill="#fdf2f2" stroke="#c0392b" stroke-width="2"/>
    <text x="80" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">③ 类器官形成</text>
    <text x="80" y="33" text-anchor="middle" font-size="9" fill="#2c2416">干细胞自我组织</text>
    <text x="80" y="46" text-anchor="middle" font-size="9" fill="#2c2416">分化形成三维结构</text>
    <text x="80" y="58" text-anchor="middle" font-size="9" fill="#7a6e5e">具有器官特征与功能</text>
  </g>

  <!-- 类器官示意小图 -->
  <g transform="translate(225, 245)">
    <!-- 类器官外形 -->
    <circle cx="50" cy="30" r="25" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <!-- 内部结构 -->
    <circle cx="42" cy="25" r="6" fill="#fff3cd" stroke="#e8c84a" stroke-width="1"/>
    <circle cx="58" cy="28" r="5" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1"/>
    <ellipse cx="50" cy="38" rx="8" ry="5" fill="#fef5f0" stroke="#8b4513" stroke-width="1"/>
    <text x="50" y="68" text-anchor="middle" font-size="8" fill="#c0392b" font-weight="600">类器官</text>
  </g>

  <!-- 箭头 3→应用 -->
  <path d="M 200 270 L 280 270" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- 右侧：应用领域 -->
  <text x="540" y="58" text-anchor="middle" font-size="13" font-weight="700" fill="#8b4513">四大应用领域</text>

  <!-- 应用1：疾病模型 -->
  <g transform="translate(310, 75)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#f5f0e8" stroke="#8b4513" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="15" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
    <text x="25" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">病</text>
    <text x="115" y="22" font-size="11" font-weight="700" fill="#8b4513">疾病模型研究</text>
    <text x="50" y="40" font-size="9" fill="#2c2416">• 患者特异性类器官</text>
    <text x="50" y="53" font-size="9" fill="#2c2416">• 模拟遗传病、肿瘤发生</text>
    <text x="160" y="40" font-size="9" fill="#2c2416">• 感染模型</text>
    <text x="160" y="53" font-size="9" fill="#2c2416">• 机制研究</text>
  </g>

  <!-- 应用2：药物筛选 -->
  <g transform="translate(530, 75)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#f5f0e8" stroke="#8b4513" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="15" fill="#fff3cd" stroke="#e8c84a" stroke-width="1.5"/>
    <text x="25" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">药</text>
    <text x="115" y="22" font-size="11" font-weight="700" fill="#8b4513">药物筛选与毒性</text>
    <text x="50" y="40" font-size="9" fill="#2c2416">• 高通量药物筛选</text>
    <text x="50" y="53" font-size="9" fill="#2c2416">• 个体化药敏测试</text>
    <text x="160" y="40" font-size="9" fill="#2c2416">• 肝毒性·肾毒性</text>
    <text x="160" y="53" font-size="9" fill="#2c2416">• 减少动物实验</text>
  </g>

  <!-- 应用3：再生医学 -->
  <g transform="translate(310, 150)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#f5f0e8" stroke="#8b4513" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="15" fill="#e8f5e9" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="25" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#4a7c3a">再</text>
    <text x="115" y="22" font-size="11" font-weight="700" fill="#8b4513">再生医学治疗</text>
    <text x="50" y="40" font-size="9" fill="#2c2416">• 类器官移植</text>
    <text x="50" y="53" font-size="9" fill="#2c2416">• 组织修复</text>
    <text x="160" y="40" font-size="9" fill="#2c2416">• 肝·肠·视网膜</text>
    <text x="160" y="53" font-size="9" fill="#2c2416">• 个性化治疗</text>
  </g>

  <!-- 应用4：发育生物学 -->
  <g transform="translate(530, 150)">
    <rect x="0" y="0" width="200" height="60" rx="8" fill="#f5f0e8" stroke="#8b4513" stroke-width="1.5"/>
    <circle cx="25" cy="30" r="15" fill="#fef5f0" stroke="#8b4513" stroke-width="1.5"/>
    <text x="25" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">发</text>
    <text x="115" y="22" font-size="11" font-weight="700" fill="#8b4513">发育生物学研究</text>
    <text x="50" y="40" font-size="9" fill="#2c2416">• 模拟胚胎发育</text>
    <text x="50" y="53" font-size="9" fill="#2c2416">• 器官发生机制</text>
    <text x="160" y="40" font-size="9" fill="#2c2416">• 类人胚模型</text>
    <text x="160" y="53" font-size="9" fill="#2c2416">• 人类发育研究</text>
  </g>

  <!-- 下方：代表性类器官 -->
  <text x="390" y="248" text-anchor="middle" font-size="12" font-weight="700" fill="#8b4513">代表性类器官类型</text>

  <g transform="translate(50, 260)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#f0f7f4" stroke="#4a7c3a" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#4a7c3a">类脑器官</text>
    <text x="60" y="35" text-anchor="middle" font-size="9" fill="#2c2416">大脑皮层结构</text>
    <text x="60" y="47" text-anchor="middle" font-size="9" fill="#7a6e5e">神经发育研究</text>
  </g>

  <g transform="translate(180, 260)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#c0392b">类肝器官</text>
    <text x="60" y="35" text-anchor="middle" font-size="9" fill="#2c2416">肝细胞+胆管结构</text>
    <text x="60" y="47" text-anchor="middle" font-size="9" fill="#7a6e5e">药物代谢·毒性</text>
  </g>

  <g transform="translate(310, 260)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#fef5f0" stroke="#8b4513" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#8b4513">类肠器官</text>
    <text x="60" y="35" text-anchor="middle" font-size="9" fill="#2c2416">隐窝-绒毛结构</text>
    <text x="60" y="47" text-anchor="middle" font-size="9" fill="#7a6e5e">肠道疾病·感染</text>
  </g>

  <g transform="translate(440, 260)">
    <rect x="0" y="0" width="120" height="50" rx="6" fill="#fff3cd" stroke="#e8c84a" stroke-width="1.5"/>
    <text x="60" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#8b4513">类肾器官</text>
    <text x="60" y="35" text-anchor="middle" font-size="9" fill="#2c2416">肾小球+肾小管</text>
    <text x="60" y="47" text-anchor="middle" font-size="9" fill="#7a6e5e">肾病模型·肾毒性</text>
  </g>

  <g transform="translate(570, 260)">
    <rect x="0" y="0" width="160" height="50" rx="6" fill="#f5f0e8" stroke="#7a6e5e" stroke-width="1.5"/>
    <text x="80" y="20" text-anchor="middle" font-size="10" font-weight="700" fill="#2c2416">其他类型</text>
    <text x="80" y="35" text-anchor="middle" font-size="9" fill="#2c2416">类视网膜·类肺·类胃</text>
    <text x="80" y="47" text-anchor="middle" font-size="9" fill="#7a6e5e">类胰腺·类前列腺…</text>
  </g>

  <!-- 底部关键特征 -->
  <rect x="50" y="335" width="680" height="55" rx="8" fill="#fff3cd" stroke="#e8c84a" stroke-width="1.5"/>
  <text x="390" y="355" text-anchor="middle" font-size="11" font-weight="700" fill="#8b4513">类器官核心原理：干细胞的自组装（self-organization）能力</text>
  <text x="390" y="372" text-anchor="middle" font-size="9.5" fill="#2c2416">三维结构 · 器官特异性细胞类型 · 部分器官功能 · 可长期培养扩增 · 遗传操作可行</text>
  <text x="390" y="388" text-anchor="middle" font-size="9.5" fill="#c0392b" font-weight="600">竞赛要点：类器官 ≠ 真正器官（缺乏血管、免疫细胞，结构功能仍不完善）</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>
</svg>
